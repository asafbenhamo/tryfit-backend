# ============================================================================
# Shopify app configuration — the file `shopify app deploy` actually publishes.
#
# `shopify app config link` generated this by pulling what was already in the
# Partner Dashboard, which turned out to be incomplete in ways that are quiet
# until they are catastrophic. Corrected below, with the reason kept next to
# each one so nobody "tidies" them back:
#
#   redirect_urls was EMPTY. Deploying that would have told Shopify this app
#     has no valid OAuth callback, and every install — including the store
#     already connected — would fail at the moment Shopify tries to hand the
#     code back. Nothing in the CLI output says this is a problem.
#
#   application_url pointed at /auth. That is where an install STARTS, not
#     where the app lives. For an embedded app this is what Shopify loads in
#     the admin iframe, so every time the merchant opened the app it would
#     have kicked off a fresh OAuth round trip instead of showing them
#     anything. The app root serves the app when Shopify passes ?shop=&host=.
#
#   The three mandatory compliance webhooks were absent. Their absence fails
#     app review automatically, and it is the single most common reason a
#     submission is rejected on the first pass.
#
#   [app_preferences] pointed at /auth/callback. That link is shown to the
#     merchant in the admin; sending them into an OAuth callback with no
#     parameters would have produced an error page. Removed — there is no
#     preferences screen to link to.
# ============================================================================

client_id = "1b9beb4fdbba92b0da2ce8fc74a3fc16"
name = "Smart Advisor"
handle = "smart-advisor"

# Where Shopify loads the app inside the admin. NOT /auth.
application_url = "https://tryfit-backend-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_checkouts,read_customers,write_customers,read_price_rules,read_discounts,write_discounts,write_draft_orders,read_fulfillments,read_inventory,read_locations,read_marketing_events,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
# Was empty. Without this, OAuth cannot complete.
redirect_urls = [
  "https://tryfit-backend-production.up.railway.app/auth/callback"
]

[webhooks]
api_version = "2026-01"

  # The three Shopify requires of every app. All three are handled at one
  # endpoint that verifies the HMAC over the raw body and fails closed.
  # Declared here so a deploy sets them, rather than depending on someone
  # pasting the same URL into three boxes and getting all three right.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://tryfit-backend-production.up.railway.app/webhooks/compliance"
  customer_deletion_url = "https://tryfit-backend-production.up.railway.app/webhooks/compliance"
  shop_deletion_url = "https://tryfit-backend-production.up.railway.app/webhooks/compliance"

  # Also registered per-install by the OAuth callback. Declared here as well so
  # a shop whose registration call failed at install time still reaches us —
  # that loop swallows its errors, so a silent failure is possible.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/create" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/checkouts/create"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/update" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/checkouts/update"

[pos]
embedded = false

[build]
include_config_on_deploy = true
