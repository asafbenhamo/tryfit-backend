<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Advisor</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b8aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smart Advisor">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
    --sidebar-bg: #f7f8fa;
    --header-bg: rgba(255, 255, 255, 0.9);
    --border: #eceef2;
    --border-strong: #dfe2e8;
    --user-bubble: #0b8aff;
    --user-bubble-2: #0a6fe0;
    --ai-bubble: #f1f3f6;
    --ai-text: #1c1f26;
    --text: #14171c;
    --text-dim: #8a909c;
    --accent: #0b8aff;
    --accent-glow: rgba(11, 138, 255, 0.18);
    --danger: #e0395a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100dvh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--sidebar-bg);
    border-inline-end: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width 0.28s cubic-bezier(0.16,1,0.3,1), transform 0.28s cubic-bezier(0.16,1,0.3,1);
    z-index: 30; overflow: hidden;
  }
  .sidebar.collapsed { width: 0; border-inline-end: none; }
  .sidebar-head, .convo-list { min-width: 280px; }
  .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
  .new-chat-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-family: 'Heebo', sans-serif;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  .new-chat-btn:active { transform: scale(0.97); }
  .new-chat-btn:hover { background: var(--user-bubble-2); }
  .convo-list { flex: 1; overflow-y: auto; padding: 8px; }
  .convo-list::-webkit-scrollbar { width: 6px; }
  .convo-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .convo-item {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    font-size: 14px; color: var(--text); margin-bottom: 2px;
    transition: background 0.15s; position: relative;
  }
  .convo-item:hover { background: rgba(0,0,0,0.05); }
  .convo-item.active { background: rgba(11,138,255,0.12); font-weight: 600; }
  .convo-title {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .convo-del {
    border: none; background: none; color: var(--text-dim); cursor: pointer;
    font-size: 16px; padding: 2px 4px; border-radius: 6px; opacity: 0;
    transition: opacity 0.15s, color 0.15s; flex-shrink: 0;
  }
  .convo-item:hover .convo-del { opacity: 1; }
  .convo-del:hover { color: var(--danger); background: rgba(224,57,90,0.1); }
  .convo-empty { padding: 24px 14px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.6; }

  /* ===== MAIN ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    background: var(--header-bg); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); z-index: 5;
  }
  .menu-btn {
    border: none; background: none; cursor: pointer;
    font-size: 22px; color: var(--text); padding: 2px 6px; flex-shrink: 0;
  }
  .header-text { flex: 1; text-align: center; }
  .header-text h1 { font-size: 16px; font-weight: 700; }
  .header-text p {
    font-size: 12px; color: var(--text-dim); font-weight: 400;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #25c685; box-shadow: 0 0 7px rgba(37,198,133,0.5); animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .money-counter {
    min-width: 84px; text-align: center; padding: 2px 8px;
    background: none; border: none; cursor: default;
  }
  .money-label { font-size: 9px; color: var(--text-dim); font-weight: 500; white-space: nowrap; }
  .money-amount { font-size: 16px; font-weight: 700; color: #16a34a; line-height: 1.2; letter-spacing: -0.3px; }
  .money-amount.bump { animation: bump 0.6s cubic-bezier(0.16,1,0.3,1); }
  .money-counter.month .money-amount { color: #0a6fe0; }
  .money-counter.month { text-align: start; }
  @keyframes bump { 0%{transform:scale(1);} 35%{transform:scale(1.18);} 100%{transform:scale(1);} }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 0 8px;
    display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth;
    background: var(--bg);
  }
  .messages::-webkit-scrollbar { width: 0; }
  .row { width: 100%; display: flex; padding: 6px 16px; }
  .row.user { justify-content: flex-start; }
  .row.ai   { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 11px 15px;
    font-size: 15.5px; line-height: 1.6; font-weight: 400;
    white-space: pre-wrap; word-wrap: break-word;
    animation: rise 0.32s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes rise { from{opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--user-bubble), var(--user-bubble-2));
    color: #fff; border-radius: 20px 20px 20px 5px;
    box-shadow: 0 2px 10px rgba(11, 138, 255, 0.25);
  }
  .row.ai .bubble {
    background: var(--ai-bubble); color: var(--ai-text);
    border-radius: 20px 20px 5px 20px;
  }
  .row.ai .bubble table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; display:block; overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch; white-space:nowrap; }
  .row.ai .bubble th, .row.ai .bubble td { border:1px solid var(--border-strong); padding:6px 9px; text-align:start; }
  .row.ai .bubble th { background: rgba(11,138,255,0.10); font-weight:700; }
  .row.ai .bubble strong { color: #0a6fe0; font-weight: 700; }
  .row.ai .bubble a { color: #0a6fe0; text-decoration: underline; word-break: break-all; font-weight: 600; }
  .row.ai .bubble .h { font-size: 16px; font-weight: 700; margin: 10px 0 4px; }
  .row.ai .bubble code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 30px; gap: 14px; animation: rise 0.5s ease;
  }
  .welcome h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .welcome p { font-size: 14.5px; color: var(--text-dim); line-height: 1.6; max-width: 300px; }
  .insights-wrap { width: 100%; max-width: 620px; margin: 0 auto; padding: 8px 14px 4px; }
  .insights-head { font-size: 15px; font-weight: 700; color: var(--text); margin: 6px 4px 12px; display: flex; align-items: center; gap: 7px; }
  .summary-card {
    width: 100%; max-width: 620px; margin: 0 auto 6px; padding: 18px 18px 14px;
    background: linear-gradient(160deg, #f8faff, #eef4ff);
    border: 1px solid #dbe6fb; border-radius: 18px;
    animation: rise 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .summary-greeting { font-size: 16px; font-weight: 800; color: #0a2540; margin-bottom: 4px; }
  .summary-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 14px; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .plan-moves { display: flex; flex-direction: column; gap: 10px; }
  .plan-move { background: #fff; border: 1px solid #dbe6fb; border-radius: 13px; padding: 13px 14px; }
  .plan-move-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .plan-move-title { font-size: 14.5px; font-weight: 800; color: #0a2540; }
  .plan-move-rev { font-size: 14px; font-weight: 800; color: #0f8a52; }
  .plan-move-sub { font-size: 12px; color: var(--accent); font-weight: 700; margin: 3px 0 6px; }
  .plan-move-why { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }
  .plan-move-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: 'Heebo', sans-serif;
  }
  .channel-pick { display: flex; flex-direction: column; gap: 7px; margin: 6px 0 10px; }
  .chan-opt {
    display: flex; align-items: center; gap: 9px; border: 1px solid #dbe6fb;
    border-radius: 9px; padding: 10px 12px; cursor: pointer; font-size: 13.5px; font-weight: 600;
    background: #fff; transition: border-color .15s;
  }
  .chan-opt:hover { border-color: var(--accent); }
  .chan-opt input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  .chan-disabled { opacity: 0.5; cursor: not-allowed; }
  .chan-disabled input { cursor: not-allowed; }
  .summary-stat {
    background: #fff; border: 1px solid #e8eefb; border-radius: 12px; padding: 10px 12px;
  }
  .summary-stat .num { font-size: 19px; font-weight: 800; color: #0a6fe0; line-height: 1.1; }
  .summary-stat .num.green { color: #16a34a; }
  .summary-stat .lbl { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .summary-line { font-size: 13px; color: #44505f; margin-top: 8px; line-height: 1.5; }
  .summary-detail-btn {
    width: 100%; margin-top: 12px; border: 1px solid #dbe6fb; background: #fff;
    color: #0a6fe0; font-family: 'Heebo',sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 10px; border-radius: 11px; cursor: pointer; transition: background 0.15s;
  }
  .summary-detail-btn:hover { background: #f4f8ff; }
  .summary-detail-row { display: flex; gap: 8px; }
  .summary-detail-row .summary-detail-btn { flex: 1; }
  .log-modal {
    position: fixed; inset: 0; background: rgba(10,20,40,0.45); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    animation: fade 0.2s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .log-box {
    background: #fff; border-radius: 18px; width: 100%; max-width: 520px;
    max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.25);
  }
  .log-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 18px; border-bottom: 1px solid #eef1f6; font-size: 16px; font-weight: 800; color: #0a2540;
  }
  .log-close { border: none; background: none; font-size: 18px; color: #888; cursor: pointer; padding: 4px 8px; }
  .log-body { padding: 12px 18px 18px; overflow-y: auto; }
  .log-empty { text-align: center; color: var(--text-dim); padding: 30px 10px; font-size: 14px; line-height: 1.6; }
  .log-item { padding: 11px 0; border-bottom: 1px solid #f2f4f8; }
  .log-item:last-child { border-bottom: none; }
  .log-item-top { font-size: 14px; color: #1a2230; }
  .log-type { font-weight: 700; }
  .log-date { font-size: 11.5px; color: var(--text-dim); }
  .log-item-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .plan-card {
    width: 100%; max-width: 620px; margin: 0 auto 10px; padding: 18px;
    background: #fff; border: 1.5px solid #0a6fe0; border-radius: 18px;
    box-shadow: 0 2px 14px rgba(10,111,224,0.10);
    animation: rise 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .plan-head { font-size: 16px; font-weight: 800; color: #0a2540; margin-bottom: 12px; }
  .plan-loading { font-size: 13.5px; color: var(--text-dim); padding: 10px 0; }
  .plan-body { font-size: 14px; line-height: 1.7; color: #2a3441; }
  .plan-body strong { color: #0a2540; }
  .plan-approve {
    width: 100%; margin-top: 14px; border: none; background: #16a34a; color: #fff;
    font-family: 'Heebo',sans-serif; font-size: 15px; font-weight: 700;
    padding: 13px; border-radius: 12px; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .plan-approve:active { transform: scale(0.98); }
  .plan-approve:hover { background: #15803d; }
  .plan-intro { font-size: 13.5px; color: #44505f; margin-bottom: 14px; line-height: 1.6; }
  .plan-intro strong { color: #16a34a; }
  .plan-tasks { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
  .plan-task {
    display: flex; align-items: flex-start; gap: 11px; padding: 12px 13px;
    background: #f8faff; border: 1px solid #e3ebf9; border-radius: 12px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .plan-task:hover { border-color: #b9d0f5; }
  .task-check { width: 19px; height: 19px; margin-top: 1px; accent-color: #16a34a; cursor: pointer; flex-shrink: 0; }
  .task-info { flex: 1; }
  .task-title { font-size: 14px; font-weight: 600; color: #1a2230; line-height: 1.4; }
  .task-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .plan-task-wrap { margin-bottom: 9px; }
  .plan-task-wrap .plan-task { margin-bottom: 0; }
  .task-expand {
    border: none; background: none; color: #0a6fe0; font-family: 'Heebo',sans-serif;
    font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px 4px 2px 4px; margin-inline-start: 30px;
  }
  .task-details {
    margin: 4px 30px 0; padding: 12px 14px; background: #f4f8ff;
    border: 1px solid #dde8fa; border-radius: 10px; animation: rise 0.25s ease;
  }
  .td-row { font-size: 13px; color: #2f3a48; line-height: 1.65; margin-bottom: 8px; }
  .td-row:last-child { margin-bottom: 0; }
  .td-label { font-weight: 700; color: #0a2540; }
  .plan-edit { display: flex; gap: 8px; margin: 4px 0 12px; }
  .plan-edit-input {
    flex: 1; border: 1px solid #dbe6fb; border-radius: 10px; padding: 10px 12px;
    font-family: 'Heebo',sans-serif; font-size: 13px; color: #1a2230; outline: none;
  }
  .plan-edit-input:focus { border-color: #0a6fe0; }
  .plan-edit-btn {
    border: none; background: #eef4ff; color: #0a6fe0; font-family: 'Heebo',sans-serif;
    font-size: 13.5px; font-weight: 700; padding: 0 18px; border-radius: 10px; cursor: pointer;
  }
  .plan-edit-btn:hover { background: #dce8ff; }
  .plan-edit-btn:disabled { opacity: 0.5; cursor: default; }
  .plan-exec-status { margin-top: 6px; }
  .agent-working { font-size: 15px; font-weight: 700; color: #0a6fe0; margin-bottom: 10px; }
  .agent-task-line { font-size: 13.5px; color: #2a3441; padding: 5px 0; line-height: 1.5; }
  .agent-summary { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e3ebf9; font-size: 14px; font-weight: 600; color: #16a34a; }
  .action-stop {
    border: 1px solid #dc2626; background: #fff; color: #dc2626;
    font-family: 'Heebo',sans-serif; font-size: 13px; font-weight: 700;
    padding: 8px 16px; border-radius: 9px; cursor: pointer; margin-top: 8px;
  }
  .action-stop:hover { background: #fef2f2; }
  /* ===== Autopilot card ===== */
  .ap-card {
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 16px;
    padding: 15px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(16,24,40,0.04);
  }
  .ap-card.on { border-color: #25c685; background: linear-gradient(180deg,#f2fdf8 0%,var(--bg) 70%); }
  .ap-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ap-title { font-size: 15px; font-weight: 800; color: var(--text); }
  .ap-pill { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
  .ap-pill.on { background: #dcfce7; color: #15803d; }
  .ap-pill.off { background: #f1f3f7; color: #6b7280; }
  .ap-desc { font-size: 13px; color: var(--text-dim); line-height: 1.55; margin: 8px 0 10px; }
  .ap-meta { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .ap-meta b { color: var(--text); }
  .ap-btn {
    width: 100%; margin-top: 11px; padding: 11px; border: none; border-radius: 10px;
    font-family: 'Heebo',sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;
    background: #16a34a; color: #fff; transition: filter .15s;
  }
  .ap-btn:hover { filter: brightness(1.06); }
  .ap-btn.is-on { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
  .ap-btn:disabled { opacity: .55; cursor: default; }
  .ap-link {
    background: none; border: none; padding: 6px 0 0; font-family: 'Heebo',sans-serif;
    font-size: 12px; color: #0a6fe0; cursor: pointer; text-align: start;
  }
  .ap-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  .ap-table th, .ap-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: start; }
  .ap-table th { color: var(--text-dim); font-weight: 600; }
  .ap-state { font-size: 11px; border-radius: 6px; padding: 2px 7px; }
  .ap-state.proven { background: #dcfce7; color: #15803d; }
  .ap-state.learning { background: #fef3c7; color: #92400e; }
  .ap-state.stopped { background: #fee2e2; color: #b91c1c; }

  .insight-card {
    background: var(--bg-soft); border: 1px solid var(--border-strong);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
    animation: rise 0.4s cubic-bezier(0.16,1,0.3,1); animation-fill-mode: both;
    border-inline-start: 4px solid var(--accent);
    position: relative; z-index: 1; touch-action: pan-y; will-change: transform;
  }
  /* While actively dragging, kill the entry animation so our transform wins. */
  .insight-card.dragging { animation: none !important; transition: none !important; }
  .insight-card.flinging { animation: none !important; }
  /* Tinder-style swipe: card sits in a slot; a red "skip" layer shows behind it
     as it slides left, and the replacement slides in with a green flash. */
  .insight-slot { position: relative; margin-bottom: 10px; }
  .insight-slot .insight-card { margin-bottom: 0; }
  .swipe-bg {
    position: absolute; inset: 0; border-radius: 16px; display: flex;
    align-items: center; padding: 0 22px; opacity: 0; z-index: 0;
    font-weight: 800; font-size: 15px; color: #fff;
  }
  .swipe-bg.skip { justify-content: flex-start; background: linear-gradient(90deg,#e0395a,#f0617f); }
  .insight-slot.flash-green .insight-card {
    animation: greenFlash 0.7s ease-out;
  }
  @keyframes greenFlash {
    0% { box-shadow: 0 0 0 0 rgba(37,198,133,0.0); background: #eafaf2; }
    30% { box-shadow: 0 0 0 3px rgba(37,198,133,0.5); background: #eafaf2; }
    100% { box-shadow: 0 0 0 0 rgba(37,198,133,0.0); background: var(--bg-soft); }
  }
  .insight-card.p1 { border-inline-start-color: #e0395a; }
  .insight-card.p2 { border-inline-start-color: #f5a623; }
  .insight-card.p3 { border-inline-start-color: #0b8aff; }
  .insight-card.p4 { border-inline-start-color: #25c685; }
  .insight-title { font-size: 14.5px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
  .insight-detail { font-size: 13.5px; color: #4a5160; line-height: 1.5; margin-bottom: 10px; }
  .insight-btn {
    border: none; background: var(--accent); color: #fff;
    font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .insight-btn:active { transform: scale(0.96); }
  .insight-btn:hover { background: var(--user-bubble-2); }
  .insights-loading { text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px; }
  .action-row-wrap { width: 100%; display: flex; justify-content: center; }
  .action-card {
    background: linear-gradient(135deg, #fff7ed, #fffbf5);
    border: 1.5px solid #f5a623; border-radius: 16px;
    padding: 16px 18px; margin: 4px 16px 8px;
    width: calc(100% - 32px); max-width: 540px; min-width: 0;
    box-sizing: border-box;

  .wa-list { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; max-height: 320px; overflow-y: auto; }

<body>
  <div class="gate" id="gate">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>

    </div>
  </aside>

  <div class="main" id="main" style="display:none">

  // ===== i18n: engine =====
  // Language resolution order: explicit ?lang= → saved choice → locale guess.
  // The store's own setting (set at install from its country) is applied after
  // login, in enterAdvisor, because /api/settings needs an authenticated password.
  let LANG = 'he';

  // English is the product default. This only decides what to paint BEFORE we
  // know which store we are looking at — the store's own setting takes over at
  // login (loadStoreLanguage), and an explicit choice outranks both.
  function guessLang() { return 'en'; }

  function lsGet(k) { try { const v = localStorage.getItem(k); return (v === 'he' || v === 'en') ? v : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // An explicit choice — the owner used the toggle, or the install link carried
  // ?lang=. This is the only thing that outranks the store's own setting.
  function readChosenLang() {
    try {
      const q = new URLSearchParams(location.search).get('lang');
      if (q === 'he' || q === 'en') { lsSet('advisorLang', q); return q; }
    } catch (e) {}
    return lsGet('advisorLang');
  }

  // What to paint before login, when we can't ask the server yet.
  function initialLang() {
    return readChosenLang() || lsGet('advisorStoreLang') || guessLang();
  }

  function t(key, vars) {
    const table = I18N[LANG] || I18N.he;
    let s = table[key];
    if (s === undefined) s = (I18N.he[key] !== undefined ? I18N.he[key] : key);
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }

  // Locale for toLocaleString / date formatting.
  function loc() { return LANG === 'he' ? 'he-IL' : 'en-US'; }
  function isRtl() { return LANG === 'he'; }

  // Money is shown in the store's own currency (set at install), not in shekels.
  let CURRENCY = '₪';
  const CURRENCY_SIGN = { ILS: '₪', USD: '$', EUR: '€', GBP: '£', AUD: 'A$', CAD: 'C$' };
  function money(n) {
    // store_settings stores the currency as a SYMBOL ('₪', '$'), but an ISO code
    // ('ILS') can arrive too. Map codes to symbols; pass a symbol straight
    // through. Only an unrecognised 3-letter code gets a separating space —
    // otherwise we would render "₪ 21,797".
    const cur = String(CURRENCY || '₪');
    const sign = CURRENCY_SIGN[cur.toUpperCase()] || (/^[A-Za-z]{3}$/.test(cur) ? cur.toUpperCase() + ' ' : cur);
    return sign + (Number(n) || 0).toLocaleString(loc());
  }

  // Fills any element carrying a data-i18n* attribute. Static markup uses these
  // so the shell can be re-translated in place when the language changes.
  function applyStaticI18n(root) {
    const scope = root || document;
    scope.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    scope.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
    scope.querySelectorAll('[data-i18n-ph]').forEach(el => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
    scope.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.getAttribute('data-i18n-title'))); });
  }

  // When a master has selected a store, automatically attach ?shop=/shop: to our
  // own API requests so the backend serves the right store. Store logins don't
  // need this (their password already identifies the store).
  // ===== One place where every API call is fixed up =====
  //
  // Call sites all over this file build URLs like `/api/x?password=` + PASSWORD.
  // Sending the store's actual password on every request is the problem: query
  // strings are written verbatim into server access logs, kept in browser
  // history, and leaked through the Referer header to any third-party origin the
  // page touches. And that password never expires.
  //
  // Rather than edit ~26 call sites (and rely on nobody adding a 27th), this
  // wrapper is the single choke point: it attaches the session token as a
  // header and STRIPS the password out of both the query string and the JSON
  // body. The call sites are free to keep writing ?password= — it never leaves
  // the browser once we hold a token.
  (function patchFetch(){
    const _fetch = window.fetch;
    window.fetch = function(url, opts) {
      try {
        if (typeof url === 'string' && (url.indexOf('/api/') === 0 || url.indexOf('/admin/') === 0)) {
          opts = opts || {};

          if (AUTH_TOKEN) {
            // Headers may arrive as a Headers instance, an array, or a plain
            // object — normalise before adding to any of them.
            const h = new Headers(opts.headers || {});
            h.set('Authorization', 'Bearer ' + AUTH_TOKEN);
            opts.headers = h;

            // Remove the password from the URL now that the token carries auth.
            if (url.indexOf('password=') > -1) {
              const [path, qs] = url.split('?');
              const params = new URLSearchParams(qs || '');
              params.delete('password');
              const rest = params.toString();
              url = rest ? path + '?' + rest : path;
            }
          }

          // Master acting on a chosen store still has to name it.
          if (SELECTED_SHOP && url.indexOf('shop=') === -1 && (AUTH_TOKEN || url.indexOf('password=') > -1)) {
            url += (url.indexOf('?') > -1 ? '&' : '?') + 'shop=' + encodeURIComponent(SELECTED_SHOP);
          }

          if (opts.body && typeof opts.body === 'string') {
            try {
              const b = JSON.parse(opts.body);
              if (b && typeof b === 'object') {
                let touched = false;
                if (SELECTED_SHOP && !b.shop) { b.shop = SELECTED_SHOP; touched = true; }
                // Same reasoning as the query string: with a token in the header
                // the body has no reason to carry the password.
                if (AUTH_TOKEN && b.password) { delete b.password; touched = true; }
                if (touched) opts.body = JSON.stringify(b);
              }
            } catch(e) {}
          }
        }
      } catch(e) {}
      return _fetch(url, opts);
    };
  })();

  async function unlock() {
    const pass = $('gatePass').value.trim();
    if (!pass) { $('gateErr').textContent = t('gate.needPass'); return; }
    $('gateErr').textContent = '';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      if (res.status === 404) { $('gateErr').textContent = t('gate.serverStale'); return; }
      let data;
      try { data = await res.json(); }
      catch (e) { $('gateErr').textContent = t('gate.badResponse', { code: res.status }); return; }
      if (!data.ok) { $('gateErr').textContent = data.error || t('gate.wrongPass'); return; }
      PASSWORD = pass;
      // Prefer the token from here on. PASSWORD is kept only so a server that
      // has not yet been redeployed still authenticates.
      AUTH_TOKEN = data.token || '';
      if (data.mode === 'master') {
        IS_MASTER = true;
        showStorePicker(data.stores || []);
      } else {
        SELECTED_SHOP = ''; // store login: password identifies the store
        if (data.terms_accepted === false) {
          showTermsGate(data.name || '');
        } else {
          enterAdvisor(data.name || '', data.shop || '');
        }
      }
    } catch (err) {
      $('gateErr').textContent = t('gate.loginError', { msg: (err.message || '') });
    }
  }

  function enterAdvisor(storeName, shopDomain) {
    if (storeName) {
      window._storeName = storeName;
      $('gateTitle').textContent = t('gate.titleStore', { store: storeName });
      const hdrTitle = document.getElementById('hdrTitle');
      if (hdrTitle) hdrTitle.textContent = t('hdr.titleStore', { store: storeName });
      const hdrStore = document.getElementById('hdrStore');
      if (hdrStore) hdrStore.textContent = t('hdr.connected', { store: storeName });
      document.title = t('hdr.titleStore', { store: storeName });
      // Update the PWA home-screen app name + icon to this store. Prefer ?shop=
      // (so the manifest can serve the store's own logo as the icon); fall back to name.
      try {
        const mani = document.querySelector('link[rel="manifest"]');
        if (mani) {
          mani.setAttribute('href', shopDomain
            ? '/manifest.json?shop=' + encodeURIComponent(shopDomain)
            : '/manifest.json?name=' + encodeURIComponent(storeName));
        }
        const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute('content', t('app.shortTitle', { store: storeName }));
        // iOS uses the apple-touch-icon link (not the manifest) for the home-screen
        // icon. Point it at the store's logo if we have the shop on record.
        if (shopDomain) {
          let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleIcon) appleIcon.setAttribute('href', '/store-icon?shop=' + encodeURIComponent(shopDomain));
        }
      } catch (e) {}
    }
    $('gate').style.display = 'none';
    $('sidebar').style.display = 'flex';
    $('main').style.display = 'flex';
    $('input').focus();
    // Master can switch stores: show a small button in the sidebar.
    if (IS_MASTER) addSwitchStoreButton();
    loadStoreLanguage();
    loadConvoList();
    setupHomeSections();     // must run first — it creates the slot the card renders into
    loadAutopilot();
    loadDailySummary();
    loadInsights();
    loadMoneyCounter();
    loadCreditsBalance();
    loadWaConfig();
    loadSmsConfig();
    setInterval(loadMoneyCounter, 60000);
    setupPushNotifications();
  }

  // ---- Web Push: register SW, ask permission, subscribe ----
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  async function setupPushNotifications() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const reg = await navigator.serviceWorker.register('/sw.js');
      // Get the server's VAPID public key.
      const keyRes = await fetch('/api/push/public-key');
      const keyData = await keyRes.json();
      if (!keyData.ok || !keyData.configured || !keyData.key) return;
      // Ask permission (only prompts once; silent if already decided).
      let perm = Notification.permission;
      if (perm === 'default') perm = await Notification.requestPermission();
      if (perm !== 'granted') return;
      // Subscribe (or reuse existing subscription).
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(keyData.key)
        });
      }
      await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD, subscription: sub })
      });
    } catch (e) { /* push is best-effort; never block the app */ }
  }

  /* ===== AUTOPILOT — the switch that lets the agent act on its own ===== */
  window._autopilot = null;

  async function loadAutopilot() {
    // Deliberately does NOT bail when the slot is missing: the fetch is cheap and
    // the result is cached, so whoever builds the home screen next can render it.
    // (An earlier version returned here and the card silently never appeared.)
    try {

  function renderAutopilot(d) {
    const slot = document.getElementById('homeAutopilotSlot');
    if (!slot) return;
    const on = !!d.on;
    const last = (d.runs || []).find(r => r.status === 'done');

    const e = d.earned || {};
    let meta = '<div class="ap-meta">';
    // The headline: money the agent brought in, on its own record.
    meta += '<b>' + esc(t('ap.earned', { amount: money(e.total || 0) })) + '</b><br>';
    if (e.this_month) meta += esc(t('ap.earnedMonth', { amount: money(e.this_month) })) + '<br>';
    if (e.outreaches) meta += esc(t('ap.record', { outreaches: e.outreaches, conversions: e.conversions || 0 })) + '<br>';
    meta += esc(t('ap.today', { used: (d.today && d.today.used) || 0, cap: (d.today && d.today.cap) || d.daily_cap })) + '<br>';
    meta += esc(t('ap.timezone', { tz: d.timezone || '' }));
    if (last) {
      meta += '<br>' + esc(t('ap.lastRun', {
        date: last.local_date, contacted: last.contacted, rejected: last.rejected_not_smart
      }));
    } else if (on) {
      meta += '<br>' + esc(t('ap.noRuns'));
    }
    meta += '</div>';

    slot.innerHTML =
      '<div class="ap-card' + (on ? ' on' : '') + '">'
      + '<div class="ap-head"><span class="ap-title">' + esc(t('ap.title')) + '</span>'
      + '<span class="ap-pill ' + (on ? 'on' : 'off') + '">' + esc(t(on ? 'ap.statusOn' : 'ap.statusOff')) + '</span></div>'
      + '<div class="ap-desc">' + esc(on ? t('ap.onDesc', { hour: d.run_hour }) : t('ap.offDesc')) + '</div>'
      + meta
      + '<button class="ap-btn' + (on ? ' is-on' : '') + '" id="apToggleBtn">'
      + esc(t(on ? 'ap.turnOff' : 'ap.turnOn')) + '</button>'
      + '<button class="ap-link" id="apPolicyBtn">' + esc(t('ap.explain')) + '</button>'
      + '</div>';

    const btn = document.getElementById('apToggleBtn');
    if (btn) btn.onclick = () => toggleAutopilot(!on, d);
    const pol = document.getElementById('apPolicyBtn');
    if (pol) pol.onclick = showPolicy;
  }

  async function toggleAutopilot(turnOn, d) {
    // Turning it ON hands the agent the right to message real customers with no
    // further approval, so say plainly what that means before it happens.
    if (turnOn) {
      const cap = (d && d.daily_cap) || 500;
      if (!confirm(t('ap.confirmOn', { cap: cap }))) return;
    }
    const btn = document.getElementById('apToggleBtn');
    if (btn) btn.disabled = true;
    try {
      const res = await fetch('/api/autopilot?password=' + encodeURIComponent(PASSWORD), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD, on: turnOn })
      });
      const r = await res.json();
      if (!r.ok) { alert(r.error || t('ap.error')); if (btn) btn.disabled = false; return; }
      await loadAutopilot();
    } catch (e) {
      alert(t('ap.error'));
      if (btn) btn.disabled = false;
    }
  }

  /* ===== ACTIONS LOG (detail view) =====
     mode 'done'    -> only converted actions (closed a loop, brought money)
     mode 'pending' -> actions not yet converted: still-waiting + expired */
  async function showActionsLog(mode) {
    mode = mode || 'done';
    const title = t(mode === 'done' ? 'log.titleDone' : 'log.titlePending');
    let modal = document.getElementById('actionsLogModal');
    if (modal) modal.remove(); // rebuild so switching between the two views works
    modal = document.createElement('div');
    modal.id = 'actionsLogModal';
    modal.className = 'log-modal';
    modal.innerHTML = '<div class="log-box"><div class="log-head"><span>' + esc(title) + '</span><button class="log-close" onclick="document.getElementById(\'actionsLogModal\').style.display=\'none\'">✕</button></div><div class="log-body" id="logBody">' + esc(t('credits.loading')) + '</div></div>';
    document.body.appendChild(modal);
    modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    try {
      const res = await fetch('/api/advisor-actions-log?password=' + encodeURIComponent(PASSWORD));
      const data = await res.json();
      const body = document.getElementById('logBody');
      let actions = (data.ok && data.actions) ? data.actions : [];
      // Filter by mode.
      if (mode === 'done') {
        actions = actions.filter(a => a.outcome === 'converted');
      } else {
        // Pending list shows ONLY items still awaiting a result — not converted,
        // not expired (those just clutter the actionable list).
        actions = actions.filter(a => a.outcome === 'pending');
      }
      if (actions.length === 0) {
        const emptyMsg = mode === 'done'
          ? t('log.emptyDone')
          : t('log.emptyPending');
        body.innerHTML = '<div class="log-empty">' + esc(emptyMsg) + '</div>';
        return;
      }
      let html = '';
      actions.forEach(a => {
        const date = new Date(a.created_at);
        const dateStr = date.toLocaleDateString(loc(), { day: 'numeric', month: 'numeric' }) + ' ' + date.toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' });
        const statusIcon = a.outcome === 'converted' ? '✅' : (a.outcome === 'pending' ? '⏳' : '○');
        const statusText = a.outcome === 'converted' ? t('log.converted', { amount: money(a.revenue) }) : t(a.outcome === 'pending' ? 'log.waiting' : 'log.expired');
        html += '<div class="log-item">';
        html += '<div class="log-item-top">' + statusIcon + ' <span class="log-type">' + esc(a.type_label) + '</span> <span class="log-date">' + dateStr + '</span></div>';
        html += '<div class="log-item-sub">' + esc(a.target);
        if (a.coupon) html += esc(t('log.coupon', { code: a.coupon }));
        if (statusText) html += ' · ' + esc(statusText);
        html += '</div></div>';
      });
      body.innerHTML = html;
    } catch (err) {
      const b = document.getElementById('logBody');
      if (b) b.innerHTML = '<div class="log-empty">' + esc(t('master.loadError')) + '</div>';
    }
  }

  /* ===== AGENT DAILY PLAN (propose -> select -> execute -> track) ===== */
  async function loadDailyPlan() {
    if (!$('welcome')) return;
    const wrap = document.createElement('div');
    wrap.className = 'plan-card';
    wrap.id = 'agentPlanCard';
    wrap.innerHTML = '<div class="plan-head">' + esc(t('plan.title')) + '</div><div class="plan-loading">' + esc(t('plan.building')) + '</div>';
    const slot = document.getElementById('homePlanSlot');
    if (slot) slot.appendChild(wrap);
    else return;
    try {
      const res = await fetch('/api/agent/propose-plan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD })
      });
      const data = await res.json();
      if (!$('welcome')) { wrap.remove(); return; }
      if (!data.ok || !data.tasks || data.tasks.length === 0) { wrap.remove(); return; }
      renderAgentPlan(wrap, data);
    } catch (err) {
      wrap.remove();
    }
  }
  function renderAgentPlan(wrap, data, checkedSet) {
    window._agentPlanId = data.plan_id;
    window._agentPlanTasks = data.tasks || [];
    let html = '<div class="plan-head">' + esc(t('plan.title')) + '</div>';
    html += '<div class="plan-intro">' + t('plan.intro', { amount: esc(money(data.projected_revenue||0)) }) + '</div>';
    html += '<div class="plan-tasks">';
    data.tasks.forEach((task, idx) => {
      let det = {};
      try { det = (typeof task.params === 'string' ? JSON.parse(task.params) : task.params || {}).details || {}; } catch(e) {}
      const hasDetails = det.what || det.goal || det.why;
      const isChecked = checkedSet && checkedSet.has(task.id) ? ' checked' : '';
      html += '<div class="plan-task-wrap">';
      html += '<label class="plan-task">'
        + '<input type="checkbox" class="task-check" value="' + task.id + '"' + isChecked + '>'
        + '<div class="task-info">'
        + '<div class="task-title">' + (idx+1) + '. ' + esc(task.title) + '</div>'
        + '<div class="task-meta">' + esc(t('plan.taskMeta', { customers: task.est_customers, amount: money(Math.round(task.projected_revenue||0)) })) + '</div>'
        + '</div></label>';
      if (hasDetails) {
        html += '<button class="task-expand" data-idx="' + idx + '">' + esc(t('plan.explain')) + '</button>';
        html += '<div class="task-details" id="taskDet' + idx + '" style="display:none">';
        if (det.what) html += '<div class="td-row"><span class="td-label">' + esc(t('plan.what')) + '</span> ' + esc(det.what) + '</div>';
        if (det.goal) html += '<div class="td-row"><span class="td-label">' + esc(t('plan.goal')) + '</span> ' + esc(det.goal) + '</div>';
        if (det.why) html += '<div class="td-row"><span class="td-label">' + esc(t('plan.why')) + '</span> ' + esc(det.why) + '</div>';
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="plan-edit">'
      + '<input type="text" class="plan-edit-input" id="planEditInput" placeholder="' + esc(t('plan.editPh')) + '">'
      + '<button class="plan-edit-btn" id="planEditBtn">' + esc(t('plan.edit')) + '</button>'
      + '</div>';
    html += '<button class="plan-approve" id="execPlanBtn">' + esc(t('plan.approve')) + '</button>';
    html += '<div class="plan-exec-status" id="planExecStatus" style="display:none"></div>';
    wrap.innerHTML = html;
    wrap.querySelector('#execPlanBtn').onclick = () => executeAgentPlan(wrap);
    const editBtn = wrap.querySelector('#planEditBtn');
    const editInput = wrap.querySelector('#planEditInput');
    const doEdit = () => reviseAgentPlan(wrap, editInput.value);
    editBtn.onclick = doEdit;
    editInput.onkeydown = (e) => { if (e.key === 'Enter') doEdit(); };
    wrap.querySelectorAll('.task-expand').forEach(btn => {
      btn.onclick = () => {
        const det = wrap.querySelector('#taskDet' + btn.getAttribute('data-idx'));
        if (det) {
          const open = det.style.display !== 'none';
          det.style.display = open ? 'none' : 'block';
          btn.innerHTML = esc(t(open ? 'plan.explain' : 'plan.hide'));
        }
      };
    });
  }
  async function reviseAgentPlan(wrap, request) {
    if (!request || !request.trim()) return;
    const btn = wrap.querySelector('#planEditBtn');
    const input = wrap.querySelector('#planEditInput');
    btn.disabled = true; input.disabled = true; btn.textContent = t('plan.updating');
    try {
      const res = await fetch('/api/agent/revise-plan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD, plan_id: window._agentPlanId, request: request.trim() })
      });
      const data = await res.json();
      if (data.ok && data.tasks) {
        // Remember which tasks the user had checked, so an edit doesn't reset them.
        const stillChecked = new Set([...wrap.querySelectorAll('.task-check:checked')].map(c => parseInt(c.value)));
        renderAgentPlan(wrap, data, stillChecked);
      } else {
        btn.disabled = false; input.disabled = false; btn.textContent = t('plan.edit');
        alert(data.error || t('plan.editFail'));
      }
    } catch (err) {
      btn.disabled = false; input.disabled = false; btn.textContent = t('plan.edit');
      alert(t('plan.error', { msg: err.message }));
    }
  }
  async function executeAgentPlan(wrap) {
    const checks = [...wrap.querySelectorAll('.task-check:checked')].map(c => parseInt(c.value));
    if (checks.length === 0) { alert(t('plan.pickOne')); return; }
    // Count CUSTOMERS (not tasks): sum est_customers of the selected tasks.
    let custTotal = 0;
    (window._agentPlanTasks || []).forEach(t => {
      if (checks.includes(t.id)) custTotal += parseInt(t.est_customers) || 0;
    });
    if (custTotal === 0) custTotal = checks.length; // fallback
    const autoAvail = window._waConfigured && window._waTemplates && window._waTemplates.length > 0;
    if (autoAvail) {
      // Offer manual vs automatic for the agent's sends.
      askAgentSendMode(custTotal, (mode, templateName) => {
        confirmSendGate(custTotal, 'whatsapp', () => runAgentPlanExec(wrap, checks, mode, templateName));
      });
    } else {
      confirmSendGate(custTotal, 'whatsapp', () => runAgentPlanExec(wrap, checks, 'manual', null));
    }
  }

  // Ask the merchant: should the agent send manually (wa.me squares) or

    m.innerHTML = '<div class="log-box" style="max-width:420px"><div class="log-head"><span>' + esc(t('agentmode.title')) + '</span>'
      + '<button class="log-close" onclick="document.getElementById(\'agentModeModal\').remove()">✕</button></div>'
      + '<div class="log-body" style="text-align:start;line-height:1.7">'
      + '<button id="agentManual" style="width:100%;padding:12px;border:1px solid #dbe6fb;border-radius:10px;background:#fff;cursor:pointer;margin-bottom:8px;font-size:14px">' + esc(t('agentmode.manual')) + '</button>'
      + '<div style="border:1px solid #dbe6fb;border-radius:10px;padding:12px">'
      + '<div style="font-size:13px;margin-bottom:6px">' + esc(t('agentmode.auto', { count: count, balance: (window._creditsBalance||0) })) + '</div>'
      + '<select id="agentTpl" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px">' + tplOpts + '</select>'
      + '<div id="agentTplSample" style="font-size:12.5px;color:#555;background:#f8f9fc;border-radius:8px;padding:10px;margin-bottom:8px;white-space:pre-wrap;text-align:start"></div>'
      + '<button id="agentAuto" style="width:100%;padding:11px;border:none;border-radius:9px;background:#16a34a;color:#fff;font-weight:600;cursor:pointer">' + esc(t('agentmode.send')) + '</button>'

  async function pollAgentPlan(planId, el) {
    let done = false;
    async function tick() {
      try {
        const res = await fetch('/api/agent/plan-status?password=' + encodeURIComponent(PASSWORD) + '&plan_id=' + planId);
        const data = await res.json();
        if (data.ok && data.tasks) {
          const planStatus = data.plan.status;
          if (planStatus === 'done' || planStatus === 'stopped') {
            done = true;
            renderAgentResult(el, data, planStatus);
            loadMoneyCounter();
          } else {
            // still working - show simple progress lines
            let lines = data.tasks.map(t => {
              const icon = t.status === 'done' ? '✅' : (t.status === 'running' ? '⚙️' : (t.status === 'skipped' ? '⏭️' : (t.status === 'failed' ? '⚠️' : '⏳')));
              return '<div class="agent-task-line">' + icon + ' ' + esc(t.title) + '</div>';
            }).join('');
            el.innerHTML = '<div class="agent-working">' + esc(t('plan.prepping')) + '</div>' + lines;
            const b = document.createElement('button'); b.className='action-stop'; b.id='stopPlanBtn'; b.textContent=t('plan.stop');
            b.onclick = async () => { await fetch('/api/agent/stop-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PASSWORD,plan_id:planId})}); };
            el.appendChild(b);
          }
        }
      } catch (e) {}
      if (!done) setTimeout(tick, 2500);
    }
    tick();
  }
  // Renders the finished agent plan: for each executed move, show its WhatsApp

  function renderAgentResult(el, data, planStatus) {
    const verb = t(planStatus === 'stopped' ? 'plan.stopped' : 'plan.finished');

    let waSquares = []; // {label, coupon, link}
    let html = '<div class="agent-working">' + esc(t('plan.doneHead', { verb: verb })) + '</div>';

    data.tasks.forEach(t => {
      // Only show moves that actually ran. Unselected moves stay 'pending' and
      // must not appear in the results.

      const r = t.result || {};

      totalSent += (r.sent || 0);
      totalPrepared += (wa.length || r.prepared || 0);
      totalPot += (r.revenue_potential || 0);
      const icon = t.status === 'done' ? '✅' : (t.status === 'skipped' ? '⏭️' : (t.status === 'failed' ? '⚠️' : '⏳'));
      html += '<div class="agent-task-line">' + icon + ' ' + esc(t.title)

        + '</div>';

    if (waSquares.length > 0) {
      html += '<div class="wa-progress">' + esc(t('plan.waProgress', { n: waSquares.length })) + ' <strong id="agWaSent">0</strong>/' + waSquares.length + ' ' + esc(t('plan.waSentSuffix')) + '</div>';
      html += '<div class="wa-list">';
      waSquares.forEach((w, i) => {
        const label = w.name || w.phone || t('plan.customer');

    html += '<div class="agent-summary">';

    if (totalPot > 0) html += '<br>' + esc(t('plan.projected', { amount: money(totalPot) }));
    html += '<br><span style="font-size:12px;color:#666">' + esc(t('plan.trackNote')) + '</span></div>';

  // Build a single insight card as a DOM element (reused for initial render + swipe replace).
  function buildInsightCard(ins) {

  function renderInsights(insights) {

  // Swipe LEFT to skip (Tinder-style). As the card drags left a red "skip" layer
  // is revealed; releasing past the threshold flings it off-screen left, then a
  // fresh opportunity drops into the same slot with a green flash.
  let _swiping = false;
  function attachSwipe(card) {
    let startX = 0, startY = 0, curX = 0, dragging = false, decided = false, horizontal = false;
    const threshold = 75;
    const slot = card.closest('.insight-slot');
    const bg = slot ? slot.querySelector('.swipe-bg.skip') : null;
    function start(x, y) {
      if (_swiping) return;
      startX = x; startY = y; dragging = true; decided = false; horizontal = false; curX = 0;
    }
    function move(x, y, ev) {
      if (!dragging) return;
      const dx = x - startX, dy = y - startY;
      if (!decided) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        decided = true;
        horizontal = Math.abs(dx) >= Math.abs(dy);
        if (!horizontal) { dragging = false; return; } // vertical → scroll normally
        card.classList.add('dragging'); // kill CSS entry animation so our transform applies
      }
      if (ev && ev.cancelable) ev.preventDefault();
      curX = dx > 0 ? 0 : dx; // left only
      const prog = Math.min(1, -curX / 150);
      card.style.transform = 'translateX(' + curX + 'px) rotate(' + (curX / 35) + 'deg)';
      card.style.opacity = String(Math.max(0.45, 1 + curX / 340));
      if (bg) bg.style.opacity = String(prog);
    }
    function end() {
      if (!dragging) return;
      dragging = false;
      if (horizontal && curX < -threshold) {
        dismissCard(card, slot, bg);
      } else {
        card.style.transition = 'transform .2s ease, opacity .2s ease';
        card.style.transform = 'translateX(0) rotate(0)';
        card.style.opacity = '1';
        if (bg) bg.style.opacity = '0';
        setTimeout(() => card.classList.remove('dragging'), 200);
      }
      curX = 0; horizontal = false;
    }
    card.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    card.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
    card.addEventListener('touchend', end);
    card.addEventListener('mousedown', e => { start(e.clientX, e.clientY); });
    window.addEventListener('mousemove', e => { if (dragging && decided) move(e.clientX, e.clientY, e); });
    window.addEventListener('mouseup', () => { if (dragging) end(); });
  }

  async function dismissCard(card, slot, bg) {
    if (_swiping) return;
    _swiping = true;
    slot = slot || card.closest('.insight-slot');
    bg = bg || (slot ? slot.querySelector('.swipe-bg.skip') : null);
    const id = card.getAttribute('data-id');
    if (bg) bg.style.opacity = '1';
    // fling the card off-screen to the left
    card.classList.add('flinging');
    card.style.transition = 'transform .3s ease-in, opacity .3s ease-in';
    card.style.transform = 'translateX(-140%) rotate(-14deg)';
    card.style.opacity = '0';

    const dismissReq = fetch('/api/insights/dismiss', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: PASSWORD, id })
    }).catch(() => {});

    // Find a replacement: first from the in-memory pool (instant), else re-fetch.
    function onScreenIds() {
      return new Set([...document.querySelectorAll('.insight-card')].map(c => c.getAttribute('data-id')));
    }
    let replacement = null;
    {
      const on = onScreenIds(); on.delete(id);
      const idx = _insightPool.findIndex(ins => ins && !on.has(ins.id));
      if (idx !== -1) { replacement = _insightPool.splice(idx, 1)[0]; }
    }
    if (!replacement) {
      // pool empty → ask the server (it may have reset the deck and have fresh ones)
      await dismissReq;
      try {
        const res = await fetch('/api/insights?password=' + encodeURIComponent(PASSWORD));
        const data = await res.json();
        if (data.ok) {
          if (Array.isArray(data.pool)) _insightPool = data.pool.slice();
          const on = onScreenIds(); on.delete(id);
          const candidates = [...(data.insights || []), ...(data.pool || [])];
          replacement = candidates.find(ins => ins && !on.has(ins.id)) || null;
          // make sure we don't immediately re-add the same one from pool
          if (replacement) _insightPool = _insightPool.filter(p => p.id !== replacement.id);
        }
      } catch (e) {}
    }

    setTimeout(() => {
      if (!slot) { _swiping = false; return; }
      if (replacement) {
        const newCard = buildInsightCard(replacement);
        if (bg) bg.style.opacity = '0';
        card.remove();
        slot.appendChild(newCard);
        wireInsightButton(newCard);
        attachSwipe(newCard);
        newCard.style.transform = 'translateY(-6px)';
        newCard.style.opacity = '0';
        void newCard.offsetWidth;
        newCard.style.transition = 'transform .3s ease-out, opacity .3s ease-out';
        newCard.style.transform = 'translateY(0)';
        newCard.style.opacity = '1';
        slot.classList.add('flash-green');
        setTimeout(() => slot.classList.remove('flash-green'), 750);
      } else {
        slot.style.transition = 'height .25s ease, opacity .25s ease, margin .25s ease';
        slot.style.height = slot.offsetHeight + 'px';
        void slot.offsetWidth;
        slot.style.height = '0px'; slot.style.opacity = '0'; slot.style.marginBottom = '0px'; slot.style.overflow = 'hidden';
        setTimeout(() => slot.remove(), 260);
      }
      _swiping = false;
    }, 320);
  }

  /* ===== RENDER ===== */
  // We keep the FULL history in memory (for context + saving), but only display
  // the last 10 messages on screen to keep the chat clean. Older messages are
  // not shown but the advisor still remembers them.
  const MAX_VISIBLE_MSGS = 10;
  function renderHistory() {
    const m = $('messages');
    m.innerHTML = '';
    const visible = history.slice(-MAX_VISIBLE_MSGS);
    visible.forEach(msg => {
      const role = msg.role === 'user' ? 'user' : 'ai';
      addMessageDom(role, msg.content);
    });
    scrollDown();
  }
  // Keep the on-screen message count capped. Called after adding a new row.
  function trimVisibleMessages() {
    const m = $('messages');
    const rows = m.querySelectorAll('.row');
    if (rows.length > MAX_VISIBLE_MSGS) {
      for (let i = 0; i < rows.length - MAX_VISIBLE_MSGS; i++) rows[i].remove();
    }

  function linkify(s) {
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[^"=>])(https?:\/\/[^\s<]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }
  function render(text) {
    let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const lines = html.split('\n');
    let out = [], inTable = false;
    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      const isRow = /^\s*\|.*\|\s*$/.test(line);
      const isSep = /^\s*\|[\s:|-]+\|\s*$/.test(line);
      if (isRow && isSep) continue;
      if (isRow) {
        const cells = line.split('|').slice(1,-1).map(c=>c.trim());
        const isHeader = !inTable;
        if (!inTable) { out.push('<table>'); inTable = true; }
        const tag = isHeader ? 'th' : 'td';
        out.push('<tr>' + cells.map(c=>'<'+tag+'>'+linkify(c)+'</'+tag+'>').join('') + '</tr>');
      } else {
        if (inTable) { out.push('</table>'); inTable = false; }
        const h = line.match(/^\s*#{1,4}\s*(.+)$/);
        if (h) { out.push('<div class="h">' + linkify(h[1]) + '</div>'); }
        else { out.push(linkify(line)); }
      }
    }
    if (inTable) out.push('</table>');
    return out.join('\n');
  }
  /* ===== ACTION BLOCKS (the execution loop) ===== */
  function parseAction(text) {
    const m = text.match(/\[\[ACTION:([\s\S]*?)\]\]/);
    if (!m) return null;
    const raw = m[1];
    const fields = {};
    raw.split('|').forEach(part => {
      const idx = part.indexOf('=');
      if (idx > -1) {
        const key = part.slice(0, idx).trim();
        const val = part.slice(idx + 1).trim();
        fields[key] = val;
      }
    });
    return { fields, cleanText: text.replace(m[0], '').trim() };
  }
  function parseCart(text) {
    const m = text.match(/\[\[CART:([\s\S]*?)\]\]/);
    if (!m) return null;
    const fields = {};
    m[1].split('|').forEach(part => {
      const idx = part.indexOf('=');
      if (idx > -1) fields[part.slice(0, idx).trim()] = part.slice(idx + 1).trim();
    });
    return { fields, cleanText: text.replace(m[0], '').trim() };
  }
  // Capture ALL CART blocks (for batch personalized carts to many customers).
  function parseAllCarts(text) {
    const matches = [...text.matchAll(/\[\[CART:([\s\S]*?)\]\]/g)];
    if (matches.length === 0) return null;
    const carts = matches.map(m => {
      const fields = {};
      m[1].split('|').forEach(part => {
        const idx = part.indexOf('=');
        if (idx > -1) fields[part.slice(0, idx).trim()] = part.slice(idx + 1).trim();
      });
      return fields;
    });
    let cleanText = text;
    matches.forEach(m => { cleanText = cleanText.replace(m[0], ''); });
    return { carts, cleanText: cleanText.trim() };
  }
  function parseCampaign(text) {
    const m = text.match(/\[\[CAMPAIGN:([\s\S]*?)\]\]/);
    if (!m) return null;
    const fields = {};
    const raw = m[1];
    const parts = raw.split(/\|(?=[a-z_]+=)/);
    parts.forEach(part => {
      const idx = part.indexOf('=');
      if (idx > -1) fields[part.slice(0, idx).trim()] = part.slice(idx + 1).trim();
    });
    const customers = (fields.customers || '').split(';;').map(c => {
      const [name, email, phone, value] = c.split('<');
      return { name: (name||'').trim(), email: (email||'').trim(), phone: (phone||'').trim(), est_value: parseFloat(value||'0')||0 };
    }).filter(c => c.email || c.phone);
    return { fields, customers, cleanText: text.replace(m[0], '').trim() };
  }
  // Stable key for a campaign card: hash of its content. Survives reloads because
  // it's derived from the saved chat message itself.
  function campaignKey(camp) {
    const s = JSON.stringify(camp.fields) + '|' + (camp.customers||[]).map(c=>c.phone||c.email).join(',');
    let h = 0;
    for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return 'camp_' + Math.abs(h);
  }

    fetch('/api/campaign/get-result?key=' + encodeURIComponent(campKey) + '&password=' + encodeURIComponent(PASSWORD))

              min_subtotal: f.min_subtotal || null,

      } catch (err) {
        resultDiv.style.display = 'block';
        resultDiv.className = 'action-result error';
        resultDiv.innerHTML = esc(t('camp.errException', { msg: err.message }));
      }
      });
    };
  }

  // Automatic campaign: pick an approved template, preview it, send via the API
  // (deducts credits). Only reachable when the store is WhatsApp-configured.
  function startAutoCampaign(card, f, custs, custCount, approveBtn, cancelBtn, resultDiv) {
    // Filter templates relevant to this campaign's action type (fallback: all).
    const actionType = f.type || '';
    let templates = (window._waTemplates || []);
    const matched = templates.filter(t => t.action_type === mapCampaignToAction(actionType));
    const choices = matched.length > 0 ? matched : templates;
    if (choices.length === 0) {
      resultDiv.style.display = 'block';
      resultDiv.className = 'action-result error';
      resultDiv.innerHTML = esc(t('camp.noTemplates'));
      return;
    }
    // Build a template picker modal.
    let m = document.getElementById('tplPickModal');
    if (m) m.remove();
    m = document.createElement('div');
    m.id = 'tplPickModal';
    m.className = 'log-modal';
    m.style.display = 'flex';
    let h = '<div class="log-box" style="max-width:460px"><div class="log-head"><span>' + esc(t('wa.pickTitle')) + '</span>'
      + '<button class="log-close" onclick="document.getElementById(\'tplPickModal\').remove()">✕</button></div>'
      + '<div class="log-body" style="text-align:start">'
      + '<p style="font-size:13px;color:#888;margin-bottom:10px">' + esc(t('wa.pickSub', { n: custCount, balance: (window._creditsBalance||0) })) + '</p>';
    choices.forEach((tpl, i) => {
      h += '<label style="display:block;border:1px solid #dbe6fb;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer">'

        + '<div style="font-size:12.5px;color:#555;margin-top:6px;white-space:pre-wrap">' + esc(tpl.sample_text || '') + '</div></label>';
    });
    h += '<div style="display:flex;gap:8px;margin-top:12px">'
      + '<button id="tplSendBtn" style="flex:1;padding:12px;border:none;border-radius:10px;background:#16a34a;color:#fff;font-weight:600;cursor:pointer">' + esc(t('camp.tplSend', { n: custCount })) + '</button>'
      + '<button onclick="document.getElementById(\'tplPickModal\').remove()" style="padding:12px 18px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer">' + esc(t('send.cancel')) + '</button>'
      + '</div></div></div>';
    m.innerHTML = h;
    document.body.appendChild(m);
    m.onclick = (e) => { if (e.target === m) m.remove(); };
    document.getElementById('tplSendBtn').onclick = async () => {
      const sel = m.querySelector('input[name="tplpick"]:checked');
      if (!sel) return;
      const templateName = sel.value;
      m.remove();
      approveBtn.disabled = true; cancelBtn.disabled = true; approveBtn.textContent = t('camp.sendingAuto');
      try {
        const res = await fetch('/api/campaign/send-auto', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: PASSWORD,
            template_name: templateName,
            segment: custs,
            campaign_type: f.type || 'campaign',
            percentage: f.percentage ? parseInt(f.percentage) : (f.amount_ils ? null : 10),
            amount_ils: f.amount_ils ? parseFloat(f.amount_ils) : null,
            combine: (f.combine === 'no' || f.combine === 'false') ? 'no' : 'yes',
            days_valid: f.days ? parseInt(f.days) : 2,
            fixed_code: f.code || null
          })
        });
        const data = await res.json();
        card.querySelector('.action-btns').style.display = 'none';
        resultDiv.style.display = 'block';
        if (!data.ok) {
          resultDiv.className = 'action-result error';
          if (data.reason === 'no_credits' || data.error === 'no_credits') {
            resultDiv.innerHTML = esc(t('camp.outOfCredits')) + '<br><button onclick="showBuyCredits()" style="margin-top:8px;padding:8px 14px;border:none;border-radius:8px;background:#0a6fe0;color:#fff;cursor:pointer">' + esc(t('camp.buyCredits')) + '</button>';
          } else {
            resultDiv.innerHTML = esc(t('camp.errPrefix', { msg: (data.error || t('terms.error')) }));
          }
          return;
        }
        resultDiv.className = 'action-result success';
        let msg = esc(t('camp.autoSent', { n: data.sent }));
        if (data.failed > 0) msg += esc(t('camp.autoFailed', { n: data.failed }));
        if (data.stopped_no_credits) msg += t('camp.creditsRanOut', { n: (custCount - data.sent) }) + '<button onclick="showBuyCredits()" style="margin-top:6px;padding:6px 12px;border:none;border-radius:8px;background:#0a6fe0;color:#fff;cursor:pointer">' + esc(t('nav.topUp')) + '</button>';

    };

  // Map a campaign segment/type to one of the 4 template action types.
  // The campaign type text comes from the AI, so match on both languages.
  function mapCampaignToAction(type) {
    const ty = (type || '').toLowerCase();
    if (ty.includes('cart') || ty.includes('עגל')) return 'abandoned_cart';
    if (ty.includes('product') || ty.includes('מוצר')) return 'product_rec';
    if (ty.includes('personal') || ty.includes('מותאמת')) return 'personalized_cart';
    return 'win_back';
  }
  async function pollCampaign(id, total, el, campKey) {
    let done = false;
    el.innerHTML = '<div class="camp-status">' + esc(t('camp.prepping')) + '</div><button class="action-stop" id="stopBtn_' + id + '">' + esc(t('camp.stop')) + '</button>';
    const stopBtn = el.querySelector('#stopBtn_' + id);
    if (stopBtn) stopBtn.onclick = async () => {
      stopBtn.disabled = true; stopBtn.textContent = t('camp.stopping');
      try {
        await fetch('/api/campaign/stop', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: PASSWORD, id })
        });
      } catch (e) {}
    };
    async function tick() {
      try {
        const res = await fetch('/api/campaign/status?password=' + encodeURIComponent(PASSWORD) + '&id=' + id);
        const data = await res.json();
        if (!data.ok || !data.campaign) return;
        const c = data.campaign;
        const statusEl = el.querySelector('.camp-status');
        if (c.status === 'done' || c.status === 'stopped') {
          done = true;
          const stopB = el.querySelector('.action-stop'); if (stopB) stopB.remove();
          renderCampaignResult(c, el, campKey);
          loadMoneyCounter();
        } else if (statusEl) {
          statusEl.innerHTML = esc(t('camp.progress', { done: c.done, total: c.total, sent: (c.sent || 0), prepared: (c.prepared || 0) }));
        }
      } catch (e) {}
      if (!done) setTimeout(tick, 2000);
    }
    tick();
  }

  // Render the finished campaign: email summary + a clickable WhatsApp list.
  // campKey (optional): stable key for persisting this result across reloads.
  function renderCampaignResult(c, el, campKey) {
    const wa = c.whatsapp || [];
    const verb = t(c.status === 'stopped' ? 'camp.stopped' : 'camp.ready');
    let html = '<div class="camp-status">' + esc(t('camp.doneHead', { verb: verb }));
    if (c.sent > 0) html += esc(t('camp.mailsSent', { n: c.sent }));
    if (c.skipped > 0) html += esc(t('camp.skipped', { n: c.skipped }));
    html += '</div>';

    const preSent = wa.filter(w => w.sent).length;
    if (wa.length > 0) {
      html += '<div class="wa-progress">' + esc(t('camp.waProgress', { n: wa.length })) + ' <strong id="waSentCount">' + preSent + '</strong>/' + wa.length + ' ' + esc(t('plan.waSentSuffix')) + '</div>';
      html += '<div class="wa-list">';
      wa.forEach((w, i) => {
        const label = w.name || w.phone || t('plan.customer');
        const coup = w.coupon ? t('plan.couponCode', { code: w.coupon }) : '';
        const sentCls = w.sent ? ' sent' : '';
        const sentTxt = t(w.sent ? 'plan.sent' : 'plan.waSend');
        html += '<div class="wa-item">'
          + '<div><div class="wa-name">' + esc(label) + '</div>'
          + (coup ? '<div class="wa-coupon">' + esc(coup) + '</div>' : '')
          + '</div>'
          + '<a class="wa-send-btn' + sentCls + '" href="' + w.link + '" target="_blank" rel="noopener" data-i="' + i + '" data-phone="' + esc(w.phone || '') + '">' + sentTxt + '</a>'
          + '</div>';
      });
      html += '</div>';
    }
    if (c.revenue_potential) {
      html += '<div class="agent-summary">' + esc(t('plan.projected', { amount: money(c.revenue_potential) }))
        + '<br><span style="font-size:12px;color:#666">' + esc(t('plan.trackNote')) + '</span></div>';
    }
    el.innerHTML = html;

    // Persist the prepared squares so a refresh doesn't lose them.
    if (campKey && wa.length > 0 && !c._restored) {
      fetch('/api/campaign/save-result', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD, key: campKey, whatsapp: wa })
      }).catch(() => {});
    }

    let sentCount = preSent;
    el.querySelectorAll('.wa-send-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('sent')) return;
        btn.classList.add('sent');
        btn.textContent = t('plan.sent');
        sentCount++;
        const counter = el.querySelector('#waSentCount');
        if (counter) counter.textContent = sentCount;
        // Persist the sent state.
        if (campKey && btn.dataset.phone) {
          fetch('/api/campaign/mark-sent', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: PASSWORD, key: campKey, phone: btn.dataset.phone })
          }).catch(() => {});
        }
      });
    });
  }

      const isBatchCart = allCarts && allCarts.carts.length > 1;
      const cart = isBatchCart ? null : parseCart(text);
      const campaign = parseCampaign(text);
      const displayText = campaign ? campaign.cleanText : (isBatchCart ? allCarts.cleanText : (cart ? cart.cleanText : (action ? action.cleanText : text)));
      bubble.innerHTML = render(displayText);
      row.appendChild(bubble);

        const cardRow = document.createElement('div');

  function addMessage(role, text, imageUrl) {

  /* ===== TYPING ===== */
  let typingTimer = null;
  // Two phases: a fixed opening, then an endless loop of "team at work" stages so
  // long tool-runs (30-90s) always show fresh activity instead of freezing.
  // Rebuilt on each use so the stages follow the current language.
  const thinkingOpen = () => [t('work.0'), t('work.1')];
  const thinkingLoop = () => [t('work.2'), t('work.3'), t('work.4'), t('work.5'),
                              t('work.6'), t('work.7'), t('work.8'), t('work.9'), t('work.10')];
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row ai';
    row.id = 'typing-msg';
    row.innerHTML = '<div class="bubble"><div class="typing"><div class="dots"><span></span><span></span><span></span></div><div class="txt" id="typing-txt">' + esc(t('work.0')) + '</div></div></div>';
    $('messages').appendChild(row);
    scrollDown();
    const startedAt = Date.now();
    let stage = 0;
    const advance = () => {
      stage++;
      const txt = $('typing-txt');
      if (!txt) return;
      const secs = Math.round((Date.now() - startedAt) / 1000);
      const open = thinkingOpen(), loop = thinkingLoop();
      let line;
      if (stage < open.length) {
        line = open[stage];
      } else {
        // Loop forever through the team-at-work stages.
        line = loop[(stage - open.length) % loop.length];
      }
      // After 12s add a living elapsed counter so it's clear work is happening.
      if (secs >= 12) line += t('work.secs', { n: secs });
      txt.textContent = line;
      typingTimer = setTimeout(advance, stage < 2 ? 1100 : 2600);
    };
    typingTimer = setTimeout(advance, 1100);
  }
  function removeTyping() {
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    const el = $('typing-msg'); if (el) el.remove();   // not `t` — that's the translator
  }
  function scrollDown() {
    const m = $('messages');
    requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
  }

  /* ===== INPUT ===== */
  const input = $('input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';

  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ===== SEND ===== */
  let _pendingImage = null; // { data, media_type, dataUrl }

  async function sendMessage() {
    const text = input.value.trim();
    if ((!text && !_pendingImage) || busy) return;
    busy = true; $('send').disabled = true;
    const imageToSend = _pendingImage;
    addMessage('user', text + (imageToSend ? (text ? '' : t('msg.image')) : ''), imageToSend ? imageToSend.dataUrl : null);
    input.value = ''; input.style.height = 'auto';
    clearAttachment();
    showTyping();
    try {
      const body = { message: text, history: history, password: PASSWORD };
      if (imageToSend) body.images = [{ data: imageToSend.data, media_type: imageToSend.media_type }];
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      removeTyping();
      if (data.error) { addMessage('ai', '⚠️ ' + data.error); }
      else {
        await streamAnswer(data.answer);
        history = data.history || history;
        saveConvo();
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', t('msg.netError'));
    } finally {
      busy = false; $('send').disabled = false; input.focus();
    }
  }

  // ===== Image attach =====
  function onImagePicked(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert(t('msg.imgTooBig')); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const comma = dataUrl.indexOf(',');
      _pendingImage = {
        dataUrl,
        media_type: file.type || 'image/jpeg',
        data: dataUrl.slice(comma + 1)
      };
      showAttachment();
    };
    reader.readAsDataURL(file);
  }
  function showAttachment() {
    const p = $('attachPreview');
    if (!p || !_pendingImage) return;
    p.innerHTML = '<img src="' + _pendingImage.dataUrl + '"><span class="ap-txt">' + esc(t('msg.imgAttached')) + '</span>'
      + '<button class="ap-remove" onclick="clearAttachment()">✕</button>';
    p.style.display = 'flex';
  }
  function clearAttachment() {
    _pendingImage = null;
    const p = $('attachPreview');
