  }

  // ===== Voice recording =====
  let _mediaRecorder = null, _audioChunks = [], _recTimer = null, _recSeconds = 0;
  let _recStream = null, _recActive = false;
  async function getMicStream() {
    // Reuse the existing stream if it's still live, so we only ask permission once.
    if (_recStream && _recStream.getTracks().some(t => t.readyState === 'live')) {
      return _recStream;
    }
    _recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    return _recStream;
  }
  async function startRecording() {
    if (_recActive) return;
    const btn = $('micBtn');
    try {
      const stream = await getMicStream();
      _audioChunks = [];
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
                 : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
      _mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      _mediaRecorder._mime = mime || 'audio/webm';
      _mediaRecorder.ondataavailable = ev => { if (ev.data.size > 0) _audioChunks.push(ev.data); };
      _mediaRecorder.onstop = onRecordingStopped;
      _mediaRecorder.start();
      _recActive = true;
      btn.classList.add('recording');
      _recSeconds = 0;
      const hintEl = document.querySelector('.composer .hint');
      if (hintEl) hintEl.textContent = t('rec.recording');
      _recTimer = setInterval(() => {
        _recSeconds++;
        if (hintEl) hintEl.textContent = t('rec.recordingSecs', { n: _recSeconds });
        if (_recSeconds >= 120) stopRecording(); // safety cap 2 min
      }, 1000);
    } catch (err) {
      alert(t('rec.noMic'));
    }
  }

  function stopRecording() {
    if (!_recActive || !_mediaRecorder) return;
    _recActive = false;
    try { if (_mediaRecorder.state === 'recording') _mediaRecorder.stop(); } catch (e) {}
  }

  async function onRecordingStopped() {
    const btn = $('micBtn');
    // Keep the stream ALIVE for reuse (so we don't re-prompt for permission). It is
    // released only when the page is closed.
    btn.classList.remove('recording');
    clearInterval(_recTimer);
    const hintEl = document.querySelector('.composer .hint');
    const mime = _mediaRecorder._mime || 'audio/webm';
    // Ignore ultra-short taps (less than ~0.4s of audio).
    if (_audioChunks.length === 0) {
      if (hintEl) hintEl.textContent = t('chat.hint');
      return;
    }
    if (hintEl) hintEl.textContent = t('rec.transcribing');
    const blob = new Blob(_audioChunks, { type: mime });
    const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
    const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
    try {
      const res = await fetch('/api/transcribe', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD, audio: b64, mime: mime })
      });
      const data = await res.json();
      if (data.ok && data.text) {
        input.value = (input.value ? input.value + ' ' : '') + data.text;
        input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px';
        input.focus();
      } else if (data.error === 'transcription_not_configured') {
        alert(t('rec.notEnabled'));
      } else {
        alert(t('rec.failed', { msg: (data.detail || data.error || t('rec.unknownError')) }));
      }
    } catch (e) { alert(t('rec.error')); }
    if (hintEl) hintEl.textContent = t('chat.hint');
  }

  // Wire press-and-hold on the mic button (works for mouse + touch via Pointer Events).
  (function bindMicHold(){
    const btn = document.getElementById('micBtn');
    if (!btn) return;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); startRecording(); });
    btn.addEventListener('pointerup', e => { e.preventDefault(); stopRecording(); });
    btn.addEventListener('pointerleave', () => { if (_recActive) stopRecording(); });
    btn.addEventListener('pointercancel', () => { if (_recActive) stopRecording(); });
    // Prevent the iOS long-press context menu / text selection.
    btn.addEventListener('contextmenu', e => e.preventDefault());
  })();

  function streamAnswer(fullText) {
    return new Promise(resolve => {
      const action = parseAction(fullText);
      const allCarts = parseAllCarts(fullText);
      const isBatchCart = allCarts && allCarts.carts.length > 1;
      const cart = isBatchCart ? null : parseCart(fullText);
      const campaign = parseCampaign(fullText);
      const displayText = campaign ? campaign.cleanText : (isBatchCart ? allCarts.cleanText : (cart ? cart.cleanText : (action ? action.cleanText : fullText)));

      clearHomeScreen();
      const row = document.createElement('div');
      row.className = 'row ai';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      row.appendChild(bubble);
      $('messages').appendChild(row);

      const tokens = displayText.split(/(\s+)/);
      let i = 0;
      const chunk = 2;
      function step() {
        if (i >= tokens.length) {
          bubble.innerHTML = render(displayText);
          if (campaign) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderCampaignCard(campaign, cardRow);
            $('messages').appendChild(cardRow);
          } else if (isBatchCart) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderCartBatchCard(allCarts, cardRow);
            $('messages').appendChild(cardRow);
          } else if (cart) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderCartCard(cart, cardRow);
            $('messages').appendChild(cardRow);
          } else if (action) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderActionCard(action, cardRow);
            $('messages').appendChild(cardRow);
          }
          scrollDown();
          resolve();
          return;
        }
        i += chunk;
        const partial = tokens.slice(0, i).join('');
        bubble.innerHTML = render(partial);
        scrollDown();
        setTimeout(step, 28);
      }
      step();
    });
  }
</script>
