<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>היועץ החכם</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b8aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="היועץ החכם">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
    --sidebar-bg: #f7f8fa;
    --header-bg: rgba(255, 255, 255, 0.9);
    --border: #eceef2;
    --border-strong: #dfe2e8;
    --user-bubble: #0b8aff;
    --user-bubble-2: #0a6fe0;
    --ai-bubble: #f1f3f6;
    --ai-text: #1c1f26;
    --text: #14171c;
    --text-dim: #8a909c;
    --accent: #0b8aff;
    --accent-glow: rgba(11, 138, 255, 0.18);
    --danger: #e0395a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100dvh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--sidebar-bg);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width 0.28s cubic-bezier(0.16,1,0.3,1), transform 0.28s cubic-bezier(0.16,1,0.3,1);
    z-index: 30; overflow: hidden;
  }
  .sidebar.collapsed { width: 0; border-left: none; }
  .sidebar-head, .convo-list { min-width: 280px; }
  .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
  .new-chat-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-family: 'Heebo', sans-serif;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  .new-chat-btn:active { transform: scale(0.97); }
  .new-chat-btn:hover { background: var(--user-bubble-2); }
  .convo-list { flex: 1; overflow-y: auto; padding: 8px; }
  .convo-list::-webkit-scrollbar { width: 6px; }
  .convo-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .convo-item {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    font-size: 14px; color: var(--text); margin-bottom: 2px;
    transition: background 0.15s; position: relative;
  }
  .convo-item:hover { background: rgba(0,0,0,0.05); }
  .convo-item.active { background: rgba(11,138,255,0.12); font-weight: 600; }
  .convo-title {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .convo-del {
    border: none; background: none; color: var(--text-dim); cursor: pointer;
    font-size: 16px; padding: 2px 4px; border-radius: 6px; opacity: 0;
    transition: opacity 0.15s, color 0.15s; flex-shrink: 0;
  }
  .convo-item:hover .convo-del { opacity: 1; }
  .convo-del:hover { color: var(--danger); background: rgba(224,57,90,0.1); }
  .convo-empty { padding: 24px 14px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.6; }

  /* ===== MAIN ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    background: var(--header-bg); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); z-index: 5;
  }
  .menu-btn {
    border: none; background: none; cursor: pointer;
    font-size: 22px; color: var(--text); padding: 2px 6px; flex-shrink: 0;
  }
  .header-text { flex: 1; text-align: center; }
  .header-text h1 { font-size: 16px; font-weight: 700; }
  .header-text p {
    font-size: 12px; color: var(--text-dim); font-weight: 400;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #25c685; box-shadow: 0 0 7px rgba(37,198,133,0.5); animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .money-counter {
    min-width: 84px; text-align: center; padding: 2px 8px;
    background: none; border: none; cursor: default;
  }
  .money-label { font-size: 9px; color: var(--text-dim); font-weight: 500; white-space: nowrap; }
  .money-amount { font-size: 16px; font-weight: 700; color: #16a34a; line-height: 1.2; letter-spacing: -0.3px; }
  .money-amount.bump { animation: bump 0.6s cubic-bezier(0.16,1,0.3,1); }
  .money-counter.month .money-amount { color: #0a6fe0; }
  .money-counter.month { text-align: right; }
  @keyframes bump { 0%{transform:scale(1);} 35%{transform:scale(1.18);} 100%{transform:scale(1);} }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 0 8px;
    display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth;
    background: var(--bg);
  }
  .messages::-webkit-scrollbar { width: 0; }
  .row { width: 100%; display: flex; padding: 6px 16px; }
  .row.user { justify-content: flex-start; }
  .row.ai   { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 11px 15px;
    font-size: 15.5px; line-height: 1.6; font-weight: 400;
    white-space: pre-wrap; word-wrap: break-word;
    animation: rise 0.32s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes rise { from{opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--user-bubble), var(--user-bubble-2));
    color: #fff; border-radius: 20px 20px 20px 5px;
    box-shadow: 0 2px 10px rgba(11, 138, 255, 0.25);
  }
  .row.ai .bubble {
    background: var(--ai-bubble); color: var(--ai-text);
    border-radius: 20px 20px 5px 20px;
  }
  .row.ai .bubble table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; display:block; overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch; white-space:nowrap; }
  .row.ai .bubble th, .row.ai .bubble td { border:1px solid var(--border-strong); padding:6px 9px; text-align:right; }
  .row.ai .bubble th { background: rgba(11,138,255,0.10); font-weight:700; }
  .row.ai .bubble strong { color: #0a6fe0; font-weight: 700; }
  .row.ai .bubble a { color: #0a6fe0; text-decoration: underline; word-break: break-all; font-weight: 600; }
  .row.ai .bubble .h { font-size: 16px; font-weight: 700; margin: 10px 0 4px; }
  .row.ai .bubble code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 30px; gap: 14px; animation: rise 0.5s ease;
  }
  .welcome h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .welcome p { font-size: 14.5px; color: var(--text-dim); line-height: 1.6; max-width: 300px; }
  .insights-wrap { width: 100%; max-width: 620px; margin: 0 auto; padding: 8px 14px 4px; }
  .insights-head { font-size: 15px; font-weight: 700; color: var(--text); margin: 6px 4px 12px; display: flex; align-items: center; gap: 7px; }
  .summary-card {
    width: 100%; max-width: 620px; margin: 0 auto 6px; padding: 18px 18px 14px;
    background: linear-gradient(160deg, #f8faff, #eef4ff);
    border: 1px solid #dbe6fb; border-radius: 18px;
    animation: rise 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .summary-greeting { font-size: 16px; font-weight: 800; color: #0a2540; margin-bottom: 4px; }
  .summary-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 14px; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .summary-stat {
    background: #fff; border: 1px solid #e8eefb; border-radius: 12px; padding: 10px 12px;
  }
  .summary-stat .num { font-size: 19px; font-weight: 800; color: #0a6fe0; line-height: 1.1; }
  .summary-stat .num.green { color: #16a34a; }
  .summary-stat .lbl { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .summary-line { font-size: 13px; color: #44505f; margin-top: 8px; line-height: 1.5; }
  .summary-detail-btn {
    width: 100%; margin-top: 12px; border: 1px solid #dbe6fb; background: #fff;
    color: #0a6fe0; font-family: 'Heebo',sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 10px; border-radius: 11px; cursor: pointer; transition: background 0.15s;
  }
  .summary-detail-btn:hover { background: #f4f8ff; }
  .summary-detail-row { display: flex; gap: 8px; }
  .summary-detail-row .summary-detail-btn { flex: 1; }
  .log-modal {
    position: fixed; inset: 0; background: rgba(10,20,40,0.45); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    animation: fade 0.2s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .log-box {
    background: #fff; border-radius: 18px; width: 100%; max-width: 520px;
    max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.25);
  }
  .log-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 18px; border-bottom: 1px solid #eef1f6; font-size: 16px; font-weight: 800; color: #0a2540;
  }
  .log-close { border: none; background: none; font-size: 18px; color: #888; cursor: pointer; padding: 4px 8px; }
  .log-body { padding: 12px 18px 18px; overflow-y: auto; }
  .log-empty { text-align: center; color: var(--text-dim); padding: 30px 10px; font-size: 14px; line-height: 1.6; }
  .log-item { padding: 11px 0; border-bottom: 1px solid #f2f4f8; }
  .log-item:last-child { border-bottom: none; }
  .log-item-top { font-size: 14px; color: #1a2230; }
  .log-type { font-weight: 700; }
  .log-date { font-size: 11.5px; color: var(--text-dim); }
  .log-item-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .plan-card {
    width: 100%; max-width: 620px; margin: 0 auto 10px; padding: 18px;
    background: #fff; border: 1.5px solid #0a6fe0; border-radius: 18px;
    box-shadow: 0 2px 14px rgba(10,111,224,0.10);
    animation: rise 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .plan-head { font-size: 16px; font-weight: 800; color: #0a2540; margin-bottom: 12px; }
  .plan-loading { font-size: 13.5px; color: var(--text-dim); padding: 10px 0; }
  .plan-body { font-size: 14px; line-height: 1.7; color: #2a3441; }
  .plan-body strong { color: #0a2540; }
  .plan-approve {
    width: 100%; margin-top: 14px; border: none; background: #16a34a; color: #fff;
    font-family: 'Heebo',sans-serif; font-size: 15px; font-weight: 700;
    padding: 13px; border-radius: 12px; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .plan-approve:active { transform: scale(0.98); }
  .plan-approve:hover { background: #15803d; }
  .plan-intro { font-size: 13.5px; color: #44505f; margin-bottom: 14px; line-height: 1.6; }
  .plan-intro strong { color: #16a34a; }
  .plan-tasks { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
  .plan-task {
    display: flex; align-items: flex-start; gap: 11px; padding: 12px 13px;
    background: #f8faff; border: 1px solid #e3ebf9; border-radius: 12px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .plan-task:hover { border-color: #b9d0f5; }
  .task-check { width: 19px; height: 19px; margin-top: 1px; accent-color: #16a34a; cursor: pointer; flex-shrink: 0; }
  .task-info { flex: 1; }
  .task-title { font-size: 14px; font-weight: 600; color: #1a2230; line-height: 1.4; }
  .task-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .plan-task-wrap { margin-bottom: 9px; }
  .plan-task-wrap .plan-task { margin-bottom: 0; }
  .task-expand {
    border: none; background: none; color: #0a6fe0; font-family: 'Heebo',sans-serif;
    font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px 4px 2px 4px; margin-right: 30px;
  }
  .task-details {
    margin: 4px 30px 0; padding: 12px 14px; background: #f4f8ff;
    border: 1px solid #dde8fa; border-radius: 10px; animation: rise 0.25s ease;
  }
  .td-row { font-size: 13px; color: #2f3a48; line-height: 1.65; margin-bottom: 8px; }
  .td-row:last-child { margin-bottom: 0; }
  .td-label { font-weight: 700; color: #0a2540; }
  .plan-edit { display: flex; gap: 8px; margin: 4px 0 12px; }
  .plan-edit-input {
    flex: 1; border: 1px solid #dbe6fb; border-radius: 10px; padding: 10px 12px;
    font-family: 'Heebo',sans-serif; font-size: 13px; color: #1a2230; outline: none;
  }
  .plan-edit-input:focus { border-color: #0a6fe0; }
  .plan-edit-btn {
    border: none; background: #eef4ff; color: #0a6fe0; font-family: 'Heebo',sans-serif;
    font-size: 13.5px; font-weight: 700; padding: 0 18px; border-radius: 10px; cursor: pointer;
  }
  .plan-edit-btn:hover { background: #dce8ff; }
  .plan-edit-btn:disabled { opacity: 0.5; cursor: default; }
  .plan-exec-status { margin-top: 6px; }
  .agent-working { font-size: 15px; font-weight: 700; color: #0a6fe0; margin-bottom: 10px; }
  .agent-task-line { font-size: 13.5px; color: #2a3441; padding: 5px 0; line-height: 1.5; }
  .agent-summary { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e3ebf9; font-size: 14px; font-weight: 600; color: #16a34a; }
  .action-stop {
    border: 1px solid #dc2626; background: #fff; color: #dc2626;
    font-family: 'Heebo',sans-serif; font-size: 13px; font-weight: 700;
    padding: 8px 16px; border-radius: 9px; cursor: pointer; margin-top: 8px;
  }
  .action-stop:hover { background: #fef2f2; }
  .insight-card {
    background: var(--bg-soft); border: 1px solid var(--border-strong);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
    animation: rise 0.4s cubic-bezier(0.16,1,0.3,1); animation-fill-mode: both;
    border-right: 4px solid var(--accent);
  }
  .insight-card.p1 { border-right-color: #e0395a; }
  .insight-card.p2 { border-right-color: #f5a623; }
  .insight-card.p3 { border-right-color: #0b8aff; }
  .insight-card.p4 { border-right-color: #25c685; }
  .insight-title { font-size: 14.5px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
  .insight-detail { font-size: 13.5px; color: #4a5160; line-height: 1.5; margin-bottom: 10px; }
  .insight-btn {
    border: none; background: var(--accent); color: #fff;
    font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .insight-btn:active { transform: scale(0.96); }
  .insight-btn:hover { background: var(--user-bubble-2); }
  .insights-loading { text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px; }
  .action-row-wrap { width: 100%; display: flex; justify-content: center; }
  .action-card {
    background: linear-gradient(135deg, #fff7ed, #fffbf5);
    border: 1.5px solid #f5a623; border-radius: 16px;
    padding: 16px 18px; margin: 4px 16px 8px;
    width: calc(100% - 32px); max-width: 540px; min-width: 0;
    box-sizing: border-box;
    animation: rise 0.35s cubic-bezier(0.16,1,0.3,1);
  }
  .action-head { font-size: 14.5px; font-weight: 800; color: #b45309; margin-bottom: 12px; }
  .action-row { font-size: 13.5px; color: #44403c; margin-bottom: 6px; }
  .action-row span { font-weight: 700; color: #78716c; }
  .action-body {
    background: #fff; border: 1px solid #fde9cc; border-radius: 10px;
    padding: 12px; margin: 10px 0; font-size: 13.5px; line-height: 1.6; color: #333;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    max-height: 220px; overflow-y: auto;
  }
  .action-row { word-break: break-word; }
  .action-btns { display: flex; gap: 8px; margin-top: 12px; }
  .action-approve {
    flex: 1; border: none; background: #16a34a; color: #fff;
    font-family: 'Heebo',sans-serif; font-size: 14px; font-weight: 700;
    padding: 11px; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.1s;
  }
  .action-approve:active { transform: scale(0.97); }
  .action-approve:hover { background: #15803d; }
  .action-approve:disabled { background: #9ca3af; cursor: default; }
  .action-cancel {
    border: 1px solid #d6d3d1; background: #fff; color: #78716c;
    font-family: 'Heebo',sans-serif; font-size: 14px; font-weight: 600;
    padding: 11px 18px; border-radius: 10px; cursor: pointer;
  }
  .action-cancel:disabled { opacity: 0.5; cursor: default; }
  .action-result { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; line-height: 1.6; }
  .action-result.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .action-result.blocked { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  .action-result.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .wa-list { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; max-height: 320px; overflow-y: auto; }
  .wa-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: #fff; border: 1px solid #e3ebf9; border-radius: 11px; }
  .wa-item .wa-name { flex: 1; font-size: 13.5px; font-weight: 600; color: #1a2230; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wa-item .wa-coupon { font-size: 11.5px; color: var(--text-dim); }
  .wa-send-btn { border: none; background: #25d366; color: #fff; font-family: 'Heebo',sans-serif; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 9px; cursor: pointer; text-decoration: none; white-space: nowrap; flex-shrink: 0; transition: background 0.15s, transform 0.1s; }
  .wa-send-btn:active { transform: scale(0.95); }
  .wa-send-btn.sent { background: #d1fadf; color: #15803d; cursor: default; pointer-events: none; }
  .wa-progress { font-size: 12.5px; color: var(--text-dim); margin: 8px 2px 4px; }
  .wa-link { display: inline-block; margin-top: 6px; background: #25d366; color: #fff !important;
    padding: 9px 16px; border-radius: 9px; text-decoration: none; font-weight: 700; }
  .typing { display: flex; align-items: center; gap: 8px; }
  .typing .dots { display: flex; gap: 4px; }
  .typing .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: bounce 1.3s infinite ease-in-out;
  }
  .typing .dots span:nth-child(2){ animation-delay: 0.18s; }
  .typing .dots span:nth-child(3){ animation-delay: 0.36s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0); opacity:0.5;} 30%{transform:translateY(-6px); opacity:1;} }
  .typing .txt { font-size: 13px; color: var(--text-dim); transition: opacity 0.3s; }
  .composer {
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border);
  }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 8px;
    max-width: 760px; margin: 0 auto;
    background: var(--bg-soft); border: 1px solid var(--border-strong);
    border-radius: 26px; padding: 5px 6px 5px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer-inner:focus-within {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }
  #input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: 'Heebo', sans-serif;
    font-size: 16px; line-height: 1.5; resize: none; max-height: 130px; padding: 9px 0;
  }
  #input::placeholder { color: var(--text-dim); }
  #send {
    width: 38px; height: 38px; flex-shrink: 0; border: none; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 17px; cursor: pointer;
    display: grid; place-items: center;
    transition: transform 0.15s, opacity 0.2s, background 0.2s;
  }
  #send:active { transform: scale(0.88); }
  #send:disabled { opacity: 0.35; cursor: not-allowed; }
  .hint { text-align: center; font-size: 10.5px; color: var(--text-dim); margin-top: 8px; opacity: 0.7; }

  /* overlay for mobile sidebar */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 25;
  }

  /* ===== GATE ===== */
  .gate {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 30px;
  }
  .gate h2 { font-size: 22px; font-weight: 700; }
  .gate p { font-size: 14px; color: var(--text-dim); margin-top: -8px; }
  .gate input {
    width: 100%; max-width: 280px; padding: 14px 18px; border-radius: 14px;
    background: var(--bg-soft); border: 1px solid var(--border-strong);
    color: var(--text); font-size: 16px; outline: none; text-align: center;
    font-family: 'Heebo', sans-serif;
  }
  .gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .gate button {

    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: 'Heebo', sans-serif;
  }
  .gate .err { color: var(--danger); font-size: 13px; min-height: 16px; }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed; top: 0; right: 0; height: 100dvh; width: 280px;
      transform: translateX(100%); box-shadow: -4px 0 24px rgba(0,0,0,0.12);
    }
    .sidebar.collapsed { width: 280px; border-left: 1px solid var(--border); }
    .sidebar.open { transform: translateX(0); }
    .overlay.show { display: block; }
  }
</style>
</head>
<body>
  <div class="gate" id="gate">
    <h2 id="gateTitle">היועץ החכם</h2>
    <p>העוזר העסקי החכם שלך</p>
    <input type="password" id="gatePass" placeholder="סיסמת גישה" autocomplete="off">
    <button onclick="unlock()">כניסה</button>
    <div class="err" id="gateErr"></div>
    <div id="storePicker" style="display:none;margin-top:18px">

  <style>
    #storeList .store-pick { display:block; width:100%; text-align:right; margin:6px 0; padding:12px 14px;
      border:1px solid #dbe6fb; background:#fff; color:#0a6fe0; border-radius:11px; cursor:pointer;
      font-family:'Heebo',sans-serif; font-size:15px; font-weight:600; }
    #storeList .store-pick:hover { background:#f4f8ff; }
    #switchStoreBtn { font-size:12px; color:#0a6fe0; background:none; border:none; cursor:pointer; }
  </style>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar" style="display:none">
    <div class="sidebar-head">
      <button class="new-chat-btn" onclick="newChat()">+ שיחה חדשה</button>
    </div>
    <div class="convo-list" id="convoList"></div>
    <div class="sidebar-foot" style="margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px">
      <div id="creditsRow" style="display:flex;align-items:center;justify-content:space-between;background:#eef4ff;border-radius:8px;padding:9px 11px;font-size:13px">
        <span>💬 קרדיטים: <strong id="creditsBalance">—</strong></span>
        <button onclick="showBuyCredits()" style="background:#0a6fe0;border:none;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer">טען עוד</button>
      </div>
      <button onclick="showRemoveCustomer()" style="background:none;border:1px solid var(--border);border-radius:8px;padding:9px;font-size:13px;color:#444;cursor:pointer;text-align:right">🚫 הסר לקוח מהדיוור</button>
      <button onclick="showTermsModal()" style="background:none;border:none;padding:6px;font-size:12px;color:#888;cursor:pointer;text-align:right">תנאי שימוש</button>

  <div class="main" id="main" style="display:none">
    <div class="header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="money-counter month" id="moneyCounterMonth" title="כמה כסף היועץ עשה לך החודש (מתאפס ב-1 לחודש)">
        <div class="money-label">החודש</div>
        <div class="money-amount" id="moneyAmountMonth">—</div>

      </div>

        <h2>איך אפשר לעזור?</h2>

    </div>
  </div>

<script>
  let PASSWORD = '';
  let SELECTED_SHOP = '';   // set when master picks a store; appended to all API calls
  let IS_MASTER = false;
  let history = [];
  let busy = false;
  let currentConvoId = null;
  const $ = id => document.getElementById(id);

  // When a master has selected a store, automatically attach ?shop=/shop: to our
  // own API requests so the backend serves the right store. Store logins don't
  // need this (their password already identifies the store).
  (function patchFetchForShop(){
    const _fetch = window.fetch;
    window.fetch = function(url, opts) {
      try {
        if (SELECTED_SHOP && typeof url === 'string' && url.indexOf('/api/') === 0) {
          // query-string requests
          if (url.indexOf('password=') > -1 && url.indexOf('shop=') === -1) {
            url += (url.indexOf('?') > -1 ? '&' : '?') + 'shop=' + encodeURIComponent(SELECTED_SHOP);
          }
          // JSON body requests
          if (opts && opts.body && typeof opts.body === 'string') {
            try {
              const b = JSON.parse(opts.body);
              if (b && b.password && !b.shop) { b.shop = SELECTED_SHOP; opts.body = JSON.stringify(b); }
            } catch(e) {}
          }
        }
      } catch(e) {}
      return _fetch(url, opts);
    };
  })();

  // ===== TERMS OF SERVICE (generic placeholder — replace with lawyer text) =====
  function getTermsHtml() {
    return `
      <h3>תנאי שימוש - היועץ החכם</h3>
      <p>השימוש ביועץ החכם ("השירות") כפוף לתנאים הבאים. אנא קראו אותם בעיון.</p>
      <p><strong>1. מהות השירות.</strong> השירות הוא כלי תוכנה (SaaS) המסייע לבעל החנות לזהות הזדמנויות שיווקיות, לנסח הודעות, ולנהל פניות ללקוחות. השירות הוא ספק הכלי בלבד; בעל החנות הוא השולח בפועל של ההודעות ונושא באחריות המלאה לשימוש בהן.</p>
      <p><strong>2. הסכמת לקוחות לדיוור.</strong> בעל החנות מצהיר ומתחייב כי קיבל מכל לקוח שאליו נשלחת הודעה את ההסכמה הנדרשת על פי דין לקבלת דיוור פרסומי, לרבות בערוץ הספציפי (מייל, WhatsApp, SMS). באחריות בעל החנות לוודא שטופס ההרשמה שלו כיסה את הערוצים הרלוונטיים.</p>
      <p><strong>3. בקשות הסרה.</strong> על פי דין, לקוח רשאי לבקש הסרה מהדיוור בכל עת. בעל החנות מתחייב לטפל בכל בקשת הסרה המגיעה אליו (לרבות תשובות להודעות מייל או WhatsApp) באופן מיידי, ולהזין את הלקוח לרשימת ההסרה בשירות באמצעות הכלי הייעודי. השירות לא יפנה שוב ללקוח שהוזן לרשימת ההסרה.</p>
      <p><strong>4. אחריות.</strong> בעל החנות נושא באחריות המלאה והבלעדית לכל שימוש בשירות, לרבות תוכן ההודעות, עיתוין, וחוקיותן. ספק השירות לא יישא באחריות לכל נזק, תביעה או קנס הנובעים משימוש שאינו תואם את הדין.</p>
      <p><strong>5. ערוץ WhatsApp.</strong> שליחת הודעות WhatsApp כפופה לתנאי השימוש של WhatsApp/Meta. בעל החנות אחראי לעמוד בהם, לרבות שימוש בהסכמה מתאימה ובמספר עסקי תקין.</p>
      <p style="color:#888;font-size:12px;margin-top:16px">נוסח זה הוא ראשוני וכללי, ויוחלף בנוסח משפטי מחייב. אישור התנאים מהווה הסכמה לפעול לפיהם.</p>
    `;
  }

  function showTermsGate(storeName) {
    $('gatePass').style.display = 'none';
    document.querySelector('#gate button').style.display = 'none';
    const sp = $('storePicker'); if (sp) sp.style.display = 'none';
    let box = document.getElementById('termsGate');
    if (!box) {
      box = document.createElement('div');
      box.id = 'termsGate';
      box.style.cssText = 'margin-top:14px;text-align:right;max-width:520px';
      $('gate').appendChild(box);
    }
    box.innerHTML =
      '<div style="max-height:300px;overflow-y:auto;background:#f8f9fc;border:1px solid #e3e8f3;border-radius:12px;padding:16px;font-size:13.5px;line-height:1.7;color:#333">'
      + getTermsHtml() + '</div>'
      + '<label style="display:flex;gap:8px;align-items:flex-start;margin:14px 2px;font-size:14px;cursor:pointer">'
      + '<input type="checkbox" id="termsChk" style="margin-top:3px"> קראתי ואני מאשר/ת את תנאי השימוש</label>'
      + '<button id="termsAcceptBtn" style="width:100%;padding:12px;border:none;border-radius:10px;background:#0a6fe0;color:#fff;font-size:15px;font-weight:600;cursor:pointer;opacity:.5" disabled>המשך ליועץ</button>'
      + '<div class="err" id="termsErr" style="color:#d33;font-size:13px;min-height:16px;margin-top:6px"></div>';
    box.style.display = 'block';
    const chk = document.getElementById('termsChk');
    const btn = document.getElementById('termsAcceptBtn');
    chk.onchange = () => { btn.disabled = !chk.checked; btn.style.opacity = chk.checked ? '1' : '.5'; };
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = 'רושם...';
      try {
        const res = await fetch('/api/terms/accept', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: PASSWORD, shop: SELECTED_SHOP || undefined })
        });
        const d = await res.json();
        if (!d.ok) { document.getElementById('termsErr').textContent = d.error || 'שגיאה'; btn.disabled = false; btn.textContent = 'המשך ליועץ'; return; }
        box.style.display = 'none';
        enterAdvisor(storeName);
      } catch (e) {
        document.getElementById('termsErr').textContent = 'שגיאה בשמירה';
        btn.disabled = false; btn.textContent = 'המשך ליועץ';
      }
    };
  }

  // Show terms again from inside the advisor (read-only, via the menu).
  function showTermsModal() {
    let m = document.getElementById('termsModal');
    if (m) { m.style.display = 'flex'; return; }
    m = document.createElement('div');
    m.id = 'termsModal';
    m.className = 'log-modal';
    m.innerHTML = '<div class="log-box"><div class="log-head"><span>תנאי שימוש</span>'
      + '<button class="log-close" onclick="document.getElementById(\'termsModal\').style.display=\'none\'">✕</button></div>'
      + '<div class="log-body" style="text-align:right;line-height:1.7;font-size:13.5px">' + getTermsHtml() + '</div></div>';
    document.body.appendChild(m);
    m.onclick = (e) => { if (e.target === m) m.style.display = 'none'; };
  }

  // Light pre-send confirmation. The merchant already agreed to the terms at
  // login, so this is just a friendly "here's what's about to happen" — no
  // checkbox, no blocking. A small footnote reminds them about consent.
  function confirmSendGate(count, channel, onConfirm) {
    const channelLabel = channel === 'whatsapp' ? 'WhatsApp' : (channel === 'email' ? 'אימייל' : 'הודעות');
    let m = document.getElementById('sendConsentModal');
    if (m) m.remove();
    m = document.createElement('div');
    m.id = 'sendConsentModal';
    m.className = 'log-modal';
    m.style.display = 'flex';
    m.innerHTML =
      '<div class="log-box" style="max-width:420px">'
      + '<div class="log-head"><span>אישור שליחה</span>'
      + '<button class="log-close" onclick="document.getElementById(\'sendConsentModal\').remove()">✕</button></div>'
      + '<div class="log-body" style="text-align:right;line-height:1.7">'
      + '<p style="font-size:15.5px">להכין <strong>' + count + '</strong> הודעות ' + channelLabel + ' ל-<strong>' + count + '</strong> לקוחות?</p>'
      + '<div style="display:flex;gap:8px;margin-top:14px">'
      + '<button id="consentGo" style="flex:1;padding:12px;border:none;border-radius:10px;background:#16a34a;color:#fff;font-weight:600;cursor:pointer">כן, להכין</button>'
      + '<button onclick="document.getElementById(\'sendConsentModal\').remove()" style="padding:12px 18px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer">ביטול</button>'
      + '</div>'
      + '<p style="font-size:11.5px;color:#aaa;margin-top:12px;line-height:1.5">* בשליחה את/ה מאשר/ת שללקוחות אלה יש הסכמה לקבל הודעות ' + channelLabel + ', בהתאם לתנאי השימוש.</p>'
      + '</div></div>';
    document.body.appendChild(m);
    m.onclick = (e) => { if (e.target === m) m.remove(); };
    document.getElementById('consentGo').onclick = () => { m.remove(); onConfirm(); };
  }

  // Load this store's WhatsApp auto-send config (is it configured? which templates?).
  // Used to decide whether to even OFFER manual/automatic on campaigns.
  window._waConfigured = false;
  window._waTemplates = [];
  async function loadWaConfig() {
    try {
      const res = await fetch('/api/wa-templates/list?password=' + encodeURIComponent(PASSWORD));
      const d = await res.json();
      if (d.ok) {
        window._waConfigured = !!d.configured && (d.templates || []).length > 0;
        window._waTemplates = d.templates || [];
      }
    } catch (e) { window._waConfigured = false; }
  }

  // Load and show the store's WhatsApp credit balance in the sidebar.
  async function loadCreditsBalance() {
    try {
      const res = await fetch('/api/wa-credits/balance?password=' + encodeURIComponent(PASSWORD));
      const d = await res.json();
      if (!d.ok) return;
      const el = document.getElementById('creditsBalance');
      if (el) el.textContent = (d.balance || 0).toLocaleString();
      window._creditsBalance = d.balance || 0;
    } catch (e) { /* silent */ }
  }

  // "Top up" — for now just instructs the merchant to contact us (no billing yet).
  function showBuyCredits() {
    let m = document.getElementById('buyCreditsModal');
    if (m) m.remove();
    m = document.createElement('div');
    m.id = 'buyCreditsModal';
    m.className = 'log-modal';
    m.style.display = 'flex';
    m.innerHTML =
      '<div class="log-box" style="max-width:400px">'
      + '<div class="log-head"><span>💬 טעינת קרדיטים</span>'
      + '<button class="log-close" onclick="document.getElementById(\'buyCreditsModal\').remove()">✕</button></div>'
      + '<div class="log-body" style="text-align:right;line-height:1.7">'
      + '<p style="font-size:14px">כל קרדיט מאפשר שליחת הודעת WhatsApp אוטומטית אחת ללקוח.</p>'
      + '<p style="font-size:14px;margin-top:8px">היתרה הנוכחית שלך: <strong>' + ((window._creditsBalance||0).toLocaleString()) + '</strong> קרדיטים.</p>'
      + '<div style="background:#f8f9fc;border-radius:10px;padding:14px;margin-top:12px;font-size:13.5px;color:#555">'
      + 'לרכישת קרדיטים נוספים, פנה למנהל המערכת. בקרוב תוכל לרכוש קרדיטים ישירות מכאן.'
      + '</div>'
      + '<button onclick="document.getElementById(\'buyCreditsModal\').remove()" style="width:100%;padding:11px;border:none;border-radius:9px;background:#0a6fe0;color:#fff;font-weight:600;cursor:pointer;margin-top:14px">הבנתי</button>'
      + '</div></div>';
    document.body.appendChild(m);
    m.onclick = (e) => { if (e.target === m) m.remove(); };
  }

  // Manual opt-out: merchant enters a customer's email/phone to remove them from
  // all future outreach (e.g. after the customer replied "remove me").
  function showRemoveCustomer() {
    let m = document.getElementById('removeCustModal');
    if (m) m.remove();
    m = document.createElement('div');
    m.id = 'removeCustModal';
    m.className = 'log-modal';
    m.style.display = 'flex';
    m.innerHTML =
      '<div class="log-box" style="max-width:420px">'
      + '<div class="log-head"><span>🚫 הסרת לקוח מהדיוור</span>'
      + '<button class="log-close" onclick="document.getElementById(\'removeCustModal\').remove()">✕</button></div>'
      + '<div class="log-body" style="text-align:right;line-height:1.6">'
      + '<p style="font-size:13.5px;color:#555">אם לקוח/ה ביקש/ה להפסיק לקבל הודעות, הזן/י כאן את המייל או הטלפון. היועץ לא יפנה אליו/ה שוב.</p>'
      + '<input id="rcEmail" type="email" placeholder="אימייל (אופציונלי)" dir="rtl" style="width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:14px;text-align:right">'
      + '<input id="rcPhone" type="tel" placeholder="טלפון (אופציונלי)" dir="rtl" style="width:100%;padding:10px;margin:0 0 8px;border:1px solid #ddd;border-radius:8px;font-size:14px;text-align:right">'
      + '<button id="rcGo" style="width:100%;padding:11px;border:none;border-radius:9px;background:#d33;color:#fff;font-weight:600;cursor:pointer">הסר מהדיוור</button>'
      + '<div id="rcMsg" style="font-size:13px;min-height:18px;margin-top:8px"></div>'
      + '</div></div>';
    document.body.appendChild(m);
    m.onclick = (e) => { if (e.target === m) m.remove(); };
    document.getElementById('rcGo').onclick = async () => {
      const email = document.getElementById('rcEmail').value.trim();
      const phone = document.getElementById('rcPhone').value.trim();
      const msg = document.getElementById('rcMsg');
      if (!email && !phone) { msg.style.color = '#d33'; msg.textContent = 'הזן מייל או טלפון'; return; }
      const btn = document.getElementById('rcGo');
      btn.disabled = true; btn.textContent = 'מסיר...';
      try {
        const res = await fetch('/api/optout/remove-customer', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: PASSWORD, email: email || null, phone: phone || null })
        });
        const d = await res.json();
        if (d.ok) {
          msg.style.color = '#16a34a';
          msg.textContent = '✅ הלקוח הוסר מהדיוור. לא נפנה אליו שוב.';
          document.getElementById('rcEmail').value = '';
          document.getElementById('rcPhone').value = '';
        } else {
          msg.style.color = '#d33'; msg.textContent = d.error || 'שגיאה';
        }
      } catch (e) {
        msg.style.color = '#d33'; msg.textContent = 'שגיאה בהסרה';
      }
      btn.disabled = false; btn.textContent = 'הסר מהדיוור';
    };
  }

  async function unlock() {
    const pass = $('gatePass').value.trim();
    if (!pass) { $('gateErr').textContent = 'הזיני סיסמה'; return; }
    $('gateErr').textContent = '';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      if (res.status === 404) { $('gateErr').textContent = 'השרת לא עודכן (חסר /api/auth/login). דחוף את server-dual.js'; return; }
      let data;
      try { data = await res.json(); }
      catch (e) { $('gateErr').textContent = 'תשובת שרת לא תקינה (קוד ' + res.status + ')'; return; }
      if (!data.ok) { $('gateErr').textContent = data.error || 'סיסמה שגויה'; return; }
      PASSWORD = pass;
      if (data.mode === 'master') {
        IS_MASTER = true;
        showStorePicker(data.stores || []);
      } else {
        SELECTED_SHOP = ''; // store login: password identifies the store
        if (data.terms_accepted === false) {
          showTermsGate(data.name || '');
        } else {
          enterAdvisor(data.name || '', data.shop || '');
        }

  // ---- Web Push: register SW, ask permission, subscribe ----
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  async function setupPushNotifications() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const reg = await navigator.serviceWorker.register('/sw.js');
      // Get the server's VAPID public key.
      const keyRes = await fetch('/api/push/public-key');
      const keyData = await keyRes.json();
      if (!keyData.ok || !keyData.configured || !keyData.key) return;
      // Ask permission (only prompts once; silent if already decided).
      let perm = Notification.permission;
      if (perm === 'default') perm = await Notification.requestPermission();
      if (perm !== 'granted') return;
      // Subscribe (or reuse existing subscription).
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(keyData.key)
        });
      }
      await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: PASSWORD, subscription: sub })
      });
    } catch (e) { /* push is best-effort; never block the app */ }
  }

  /* ===== ACTIONS LOG (detail view) =====
     mode 'done'    -> only converted actions (closed a loop, brought money)
     mode 'pending' -> actions not yet converted: still-waiting + expired */
  async function showActionsLog(mode) {
    mode = mode || 'done';
    const title = mode === 'done' ? '✅ מה שבוצע (המרות)' : '⏳ מה שעוד לא בוצע';
    let modal = document.getElementById('actionsLogModal');
    if (modal) modal.remove(); // rebuild so switching between the two views works
    modal = document.createElement('div');
    modal.id = 'actionsLogModal';
    modal.className = 'log-modal';
    modal.innerHTML = '<div class="log-box"><div class="log-head"><span>' + title + '</span><button class="log-close" onclick="document.getElementById(\'actionsLogModal\').style.display=\'none\'">✕</button></div><div class="log-body" id="logBody">טוען...</div></div>';
    document.body.appendChild(modal);
    modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    try {
      const res = await fetch('/api/advisor-actions-log?password=' + encodeURIComponent(PASSWORD));
      const data = await res.json();
      const body = document.getElementById('logBody');
      let actions = (data.ok && data.actions) ? data.actions : [];
      // Filter by mode.
      if (mode === 'done') {
        actions = actions.filter(a => a.outcome === 'converted');
      } else {
        // Pending list shows ONLY items still awaiting a result — not converted,
        // not expired (those just clutter the actionable list).
        actions = actions.filter(a => a.outcome === 'pending');
      }
      if (actions.length === 0) {
        const emptyMsg = mode === 'done'
          ? 'עדיין לא נסגרו המרות. ברגע שלקוחה תקנה בעקבות פנייה, היא תופיע כאן.'
          : 'אין כרגע פעולות שממתינות לביצוע.';
        body.innerHTML = '<div class="log-empty">' + emptyMsg + '</div>';
        return;
      }
      let html = '';
      actions.forEach(a => {
        const date = new Date(a.created_at);
        const dateStr = date.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }) + ' ' + date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
        const statusIcon = a.outcome === 'converted' ? '✅' : (a.outcome === 'pending' ? '⏳' : '○');
        const statusText = a.outcome === 'converted' ? ('הומר! ₪' + a.revenue.toLocaleString()) : (a.outcome === 'pending' ? 'ממתין לתוצאה' : 'פג תוקף / לא הומר');
        html += '<div class="log-item">';
        html += '<div class="log-item-top">' + statusIcon + ' <span class="log-type">' + esc(a.type_label) + '</span> <span class="log-date">' + dateStr + '</span></div>';
        html += '<div class="log-item-sub">' + esc(a.target);
        if (a.coupon) html += ' · קוד: ' + esc(a.coupon);
        if (statusText) html += ' · ' + statusText;
        html += '</div></div>';
      });
      body.innerHTML = html;
    } catch (err) {
      const b = document.getElementById('logBody');
      if (b) b.innerHTML = '<div class="log-empty">שגיאה בטעינה</div>';
    }
  }

  async function executeAgentPlan(wrap) {
    const checks = [...wrap.querySelectorAll('.task-check:checked')].map(c => parseInt(c.value));
    if (checks.length === 0) { alert('סמן לפחות מהלך אחד'); return; }
    // Count CUSTOMERS (not tasks): sum est_customers of the selected tasks.
    let custTotal = 0;
    (window._agentPlanTasks || []).forEach(t => {
      if (checks.includes(t.id)) custTotal += parseInt(t.est_customers) || 0;
    });
    if (custTotal === 0) custTotal = checks.length; // fallback
    const autoAvail = window._waConfigured && window._waTemplates && window._waTemplates.length > 0;
    if (autoAvail) {
      // Offer manual vs automatic for the agent's sends.
      askAgentSendMode(custTotal, (mode, templateName) => {
        confirmSendGate(custTotal, 'whatsapp', () => runAgentPlanExec(wrap, checks, mode, templateName));
      });
    } else {
      confirmSendGate(custTotal, 'whatsapp', () => runAgentPlanExec(wrap, checks, 'manual', null));
    }
  }

  async function pollAgentPlan(planId, el) {
    let done = false;
    async function tick() {
      try {
        const res = await fetch('/api/agent/plan-status?password=' + encodeURIComponent(PASSWORD) + '&plan_id=' + planId);
        const data = await res.json();
        if (data.ok && data.tasks) {
          const planStatus = data.plan.status;
          if (planStatus === 'done' || planStatus === 'stopped') {
            done = true;
            renderAgentResult(el, data, planStatus);
            loadMoneyCounter();
          } else {
            // still working - show simple progress lines
            let lines = data.tasks.map(t => {
              const icon = t.status === 'done' ? '✅' : (t.status === 'running' ? '⚙️' : (t.status === 'skipped' ? '⏭️' : (t.status === 'failed' ? '⚠️' : '⏳')));
              return '<div class="agent-task-line">' + icon + ' ' + esc(t.title) + '</div>';
            }).join('');
            el.innerHTML = '<div class="agent-working">🤖 הסוכן מכין הכל ברקע...</div>' + lines;
            const b = document.createElement('button'); b.className='action-stop'; b.id='stopPlanBtn'; b.textContent='🛑 עצור את הסוכן';
            b.onclick = async () => { await fetch('/api/agent/stop-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PASSWORD,plan_id:planId})}); };
            el.appendChild(b);
          }
        }
      } catch (e) {}
      if (!done) setTimeout(tick, 2500);
    }
    tick();
  }
  // Renders the finished agent plan: for each executed move, show its WhatsApp
  // squares (one per customer, send -> sent) exactly like a manual campaign,
  // plus a summary of emails auto-sent and coupons created.
  function renderAgentResult(el, data, planStatus) {
    const verb = planStatus === 'stopped' ? 'נעצר' : 'סיים';
    let totalSent = 0, totalPrepared = 0, totalPot = 0;
    let waSquares = []; // {label, coupon, link}
    let html = '<div class="agent-working">🏁 הסוכן ' + verb + '!</div>';

    data.tasks.forEach(t => {
      // Only show moves that actually ran. Unselected moves stay 'pending' and
      // must not appear in the results.
      if (t.status === 'pending') return;
      const r = t.result || {};
      const wa = r.whatsapp || [];
      totalSent += (r.sent || 0);
      totalPrepared += (wa.length || r.prepared || 0);
      totalPot += (r.revenue_potential || 0);
      const icon = t.status === 'done' ? '✅' : (t.status === 'skipped' ? '⏭️' : (t.status === 'failed' ? '⚠️' : '⏳'));
      html += '<div class="agent-task-line">' + icon + ' ' + esc(t.title)
        + (wa.length ? ' — ' + wa.length + ' וואטסאפ מוכנים' : '')
        + ((r.sent||0) ? ' · ' + r.sent + ' מיילים נשלחו' : '')
        + '</div>';
      wa.forEach(w => waSquares.push(w));
    });

    // All WhatsApp squares from all moves, one after another.
    if (waSquares.length > 0) {
      html += '<div class="wa-progress">📱 ' + waSquares.length + ' הודעות וואטסאפ מוכנות. לחץ "שלח" ליד כל לקוחה. <strong id="agWaSent">0</strong>/' + waSquares.length + ' נשלחו</div>';
      html += '<div class="wa-list">';
      waSquares.forEach((w, i) => {
        const label = w.name || w.phone || 'לקוחה';
        const coup = w.coupon ? ('קוד: ' + w.coupon) : '';
        html += '<div class="wa-item">'
          + '<div><div class="wa-name">' + esc(label) + '</div>'
          + (coup ? '<div class="wa-coupon">' + esc(coup) + '</div>' : '')
          + '</div>'
          + '<a class="wa-send-btn" href="' + w.link + '" target="_blank" rel="noopener" data-i="' + i + '">שלח ←</a>'
          + '</div>';
      });
      html += '</div>';
    }

    html += '<div class="agent-summary">';
    html += 'סיכום: ' + totalPrepared + ' וואטסאפ מוכנים · ' + totalSent + ' מיילים נשלחו אוטומטית';
    if (totalPot > 0) html += '<br>צפי הכנסה ₪' + totalPot.toLocaleString();
    html += '<br><span style="font-size:12px;color:#666">אעקוב ואדווח כשייסגרו מעגלים. הרווח בפועל יופיע למעלה.</span></div>';

    el.innerHTML = html;

    // Wire send -> sent toggle, same behavior as single-customer and campaign.
    let sentCount = 0;
    el.querySelectorAll('.wa-send-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('sent')) return;
        btn.classList.add('sent');
        btn.textContent = '✓ נשלח';
        sentCount++;
        const counter = el.querySelector('#agWaSent');
        if (counter) counter.textContent = sentCount;
      });
    });
  }

  // Swipe-right (or drag) to dismiss an opportunity; the server hides it for a
  // couple of days and we reload to surface a fresh one in its place.
  function attachSwipe(card) {
    let startX = 0, curX = 0, dragging = false;
    const threshold = 90;
    function start(x) { startX = x; dragging = true; card.style.transition = 'none'; }
    function move(x) {
      if (!dragging) return;
      curX = x - startX;
      if (curX < 0) curX = 0; // only allow rightward swipe (RTL: visually toward start)
      card.style.transform = 'translateX(' + curX + 'px)';
      card.style.opacity = String(Math.max(0.3, 1 - curX / 300));
    }
    async function end() {
      if (!dragging) return;
      dragging = false;
      card.style.transition = 'transform .25s, opacity .25s';
      if (curX > threshold) {
        card.style.transform = 'translateX(120%)';
        card.style.opacity = '0';
        const id = card.getAttribute('data-id');
        try {
          await fetch('/api/insights/dismiss', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: PASSWORD, id })
          });
        } catch (e) {}
        setTimeout(() => { loadInsights(); }, 260);
      } else {
        card.style.transform = '';
        card.style.opacity = '';
      }
      curX = 0;
    }
    card.addEventListener('touchstart', e => start(e.touches[0].clientX), { passive: true });
    card.addEventListener('touchmove', e => move(e.touches[0].clientX), { passive: true });
    card.addEventListener('touchend', end);
    card.addEventListener('mousedown', e => { start(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', e => { if (dragging) move(e.clientX); });
    window.addEventListener('mouseup', () => { if (dragging) end(); });
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ===== RENDER ===== */
  // We keep the FULL history in memory (for context + saving), but only display
  // the last 10 messages on screen to keep the chat clean. Older messages are
  // not shown but the advisor still remembers them.
  const MAX_VISIBLE_MSGS = 10;
  function renderHistory() {
    const m = $('messages');
    m.innerHTML = '';
    const visible = history.slice(-MAX_VISIBLE_MSGS);
    visible.forEach(msg => {
      const role = msg.role === 'user' ? 'user' : 'ai';
      addMessageDom(role, msg.content);
    });
    scrollDown();
  }
  // Keep the on-screen message count capped. Called after adding a new row.
  function trimVisibleMessages() {
    const m = $('messages');
    const rows = m.querySelectorAll('.row');
    if (rows.length > MAX_VISIBLE_MSGS) {
      for (let i = 0; i < rows.length - MAX_VISIBLE_MSGS; i++) rows[i].remove();
    }
  }
  function linkify(s) {
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[^"=>])(https?:\/\/[^\s<]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }
  function render(text) {
    let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const lines = html.split('\n');
    let out = [], inTable = false;
    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      const isRow = /^\s*\|.*\|\s*$/.test(line);
      const isSep = /^\s*\|[\s:|-]+\|\s*$/.test(line);
      if (isRow && isSep) continue;
      if (isRow) {
        const cells = line.split('|').slice(1,-1).map(c=>c.trim());
        const isHeader = !inTable;
        if (!inTable) { out.push('<table>'); inTable = true; }
        const tag = isHeader ? 'th' : 'td';
        out.push('<tr>' + cells.map(c=>'<'+tag+'>'+linkify(c)+'</'+tag+'>').join('') + '</tr>');
      } else {
        if (inTable) { out.push('</table>'); inTable = false; }
        const h = line.match(/^\s*#{1,4}\s*(.+)$/);
        if (h) { out.push('<div class="h">' + linkify(h[1]) + '</div>'); }
        else { out.push(linkify(line)); }
      }
    }
    if (inTable) out.push('</table>');
    return out.join('\n');
  }
  /* ===== ACTION BLOCKS (the execution loop) ===== */
  function parseAction(text) {
    const m = text.match(/\[\[ACTION:([\s\S]*?)\]\]/);
    if (!m) return null;
    const raw = m[1];
    const fields = {};
    raw.split('|').forEach(part => {
      const idx = part.indexOf('=');
      if (idx > -1) {
        const key = part.slice(0, idx).trim();
        const val = part.slice(idx + 1).trim();
        fields[key] = val;
      }
    });
    return { fields, cleanText: text.replace(m[0], '').trim() };
  }
  function parseCart(text) {
    const m = text.match(/\[\[CART:([\s\S]*?)\]\]/);
    if (!m) return null;
    const fields = {};
    m[1].split('|').forEach(part => {
      const idx = part.indexOf('=');
      if (idx > -1) fields[part.slice(0, idx).trim()] = part.slice(idx + 1).trim();
    });
    return { fields, cleanText: text.replace(m[0], '').trim() };
  }
  // Capture ALL CART blocks (for batch personalized carts to many customers).
  function parseAllCarts(text) {
    const matches = [...text.matchAll(/\[\[CART:([\s\S]*?)\]\]/g)];
    if (matches.length === 0) return null;
    const carts = matches.map(m => {
      const fields = {};
      m[1].split('|').forEach(part => {
        const idx = part.indexOf('=');
        if (idx > -1) fields[part.slice(0, idx).trim()] = part.slice(idx + 1).trim();
      });
      return fields;
    });
    let cleanText = text;
    matches.forEach(m => { cleanText = cleanText.replace(m[0], ''); });
    return { carts, cleanText: cleanText.trim() };
  }
  function parseCampaign(text) {
    const m = text.match(/\[\[CAMPAIGN:([\s\S]*?)\]\]/);
    if (!m) return null;
    const fields = {};
    const raw = m[1];
    const parts = raw.split(/\|(?=[a-z_]+=)/);
    parts.forEach(part => {
      const idx = part.indexOf('=');
      if (idx > -1) fields[part.slice(0, idx).trim()] = part.slice(idx + 1).trim();
    });
    const customers = (fields.customers || '').split(';;').map(c => {
      const [name, email, phone, value] = c.split('<');
      return { name: (name||'').trim(), email: (email||'').trim(), phone: (phone||'').trim(), est_value: parseFloat(value||'0')||0 };
    }).filter(c => c.email || c.phone);
    return { fields, customers, cleanText: text.replace(m[0], '').trim() };
  }
  // Stable key for a campaign card: hash of its content. Survives reloads because
  // it's derived from the saved chat message itself.
  function campaignKey(camp) {
    const s = JSON.stringify(camp.fields) + '|' + (camp.customers||[]).map(c=>c.phone||c.email).join(',');
    let h = 0;
    for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return 'camp_' + Math.abs(h);
  }
  function renderCampaignCard(camp, container) {

    else if (f.percentage) html += '<div class="action-row"><span>קופון אישי לכל אחת:</span> ' + esc(f.percentage) + '%</div>';
    if (totalValue > 0) html += '<div class="action-row"><span>צפי הכנסה:</span> ₪' + Math.round(totalValue).toLocaleString() + '</div>';
    // Show send-mode toggle ONLY for stores that have automatic WhatsApp configured.
    const autoAvailable = window._waConfigured && window._waTemplates && window._waTemplates.length > 0;
    if (autoAvailable) {
      html += '<div class="action-row" style="margin-top:6px"><span>אופן שליחה:</span></div>';
      html += '<div class="send-mode" style="display:flex;gap:8px;margin:4px 0 8px">'
        + '<label style="flex:1;border:1px solid #dbe6fb;border-radius:8px;padding:8px;cursor:pointer;font-size:13px;text-align:center"><input type="radio" name="sendmode_' + camp.id + '" value="manual" checked> ידני (אני שולח)</label>'
        + '<label style="flex:1;border:1px solid #dbe6fb;border-radius:8px;padding:8px;cursor:pointer;font-size:13px;text-align:center"><input type="radio" name="sendmode_' + camp.id + '" value="auto"> אוטומטי 💬</label>'

    html += '<div class="action-btns"><button class="action-approve">הפעל קמפיין ←</button><button class="action-cancel">בטל</button></div>';
    html += '<div class="action-result" style="display:none"></div>';
    card.innerHTML = html;
    container.appendChild(card);

    const approveBtn = card.querySelector('.action-approve');

    cancelBtn.onclick = () => card.remove();
    const custCount = (f.customers || '').split(';;').filter(Boolean).length || custs.length || 0;

    // If this campaign already ran (squares saved), restore them instead of
    // offering to activate again — so a refresh never loses the prepared sends.
    fetch('/api/campaign/get-result?key=' + encodeURIComponent(campKey) + '&password=' + encodeURIComponent(PASSWORD))
      .then(r => r.json()).then(d => {
        if (d && d.found && Array.isArray(d.whatsapp) && d.whatsapp.length > 0) {
          card.querySelector('.action-btns').style.display = 'none';

        }

    function getSendMode() {
      const sel = card.querySelector('input[name="sendmode_' + camp.id + '"]:checked');

    }

    approveBtn.onclick = () => {
      const mode = getSendMode();
      if (mode === 'auto') { startAutoCampaign(card, f, custs, custCount, approveBtn, cancelBtn, resultDiv); return; }
      // ---- manual (existing flow) ----
      confirmSendGate(custCount, 'whatsapp', async () => {
      approveBtn.disabled = true; cancelBtn.disabled = true; approveBtn.textContent = 'מתחיל...';
      try {
        const res = await fetch('/api/campaign/start', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: PASSWORD, campaign_type: f.type || 'campaign',
            segment: custs,
            template: { percentage: f.percentage ? parseInt(f.percentage) : 10,
              amount_ils: f.amount_ils ? parseFloat(f.amount_ils) : null,

              days_valid: f.days ? parseInt(f.days) : 2,
              subject: f.subject || 'הודעה מ-770', body: f.body || '' }
          })
        });
        const data = await res.json();
        card.querySelector('.action-btns').style.display = 'none';
        resultDiv.style.display = 'block';
        if (data.ok) {
          resultDiv.className = 'action-result success';
          pollCampaign(data.campaign_id, data.total, resultDiv, campKey);
        } else {
          resultDiv.className = 'action-result error';
          resultDiv.innerHTML = '❌ ' + (data.error || 'שגיאה');
        }
      } catch (err) {
        resultDiv.style.display = 'block';
        resultDiv.className = 'action-result error';
        resultDiv.innerHTML = '❌ שגיאה: ' + err.message;
      }
      });
    };
  }

  // Automatic campaign: pick an approved template, preview it, send via the API

  function startAutoCampaign(card, f, custs, custCount, approveBtn, cancelBtn, resultDiv) {
    // Filter templates relevant to this campaign's action type (fallback: all).

    document.getElementById('tplSendBtn').onclick = async () => {

      try {

  // Map a campaign segment/type to one of the 4 template action types.
  function mapCampaignToAction(type) {
    const t = (type || '').toLowerCase();
    if (t.includes('cart') || t.includes('עגל')) return 'abandoned_cart';
    if (t.includes('product') || t.includes('מוצר')) return 'product_rec';
    if (t.includes('personal') || t.includes('מותאמת')) return 'personalized_cart';
    return 'win_back';
  }
  async function pollCampaign(id, total, el, campKey) {
    let done = false;
    el.innerHTML = '<div class="camp-status">⚙️ מכין קופונים והודעות...</div><button class="action-stop" id="stopBtn_' + id + '">🛑 עצור קמפיין</button>';
    const stopBtn = el.querySelector('#stopBtn_' + id);
    if (stopBtn) stopBtn.onclick = async () => {
      stopBtn.disabled = true; stopBtn.textContent = 'עוצר...';
      try {
        await fetch('/api/campaign/stop', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: PASSWORD, id })
        });
      } catch (e) {}
    };
    async function tick() {
      try {
        const res = await fetch('/api/campaign/status?password=' + encodeURIComponent(PASSWORD) + '&id=' + id);
        const data = await res.json();
        if (!data.ok || !data.campaign) return;
        const c = data.campaign;
        const statusEl = el.querySelector('.camp-status');
        if (c.status === 'done' || c.status === 'stopped') {
          done = true;
          const stopB = el.querySelector('.action-stop'); if (stopB) stopB.remove();
          renderCampaignResult(c, el, campKey);
          loadMoneyCounter();
        } else if (statusEl) {
          statusEl.innerHTML = '⚙️ עובד... ' + c.done + '/' + c.total
            + ' (' + (c.sent || 0) + ' מיילים נשלחו, ' + (c.prepared || 0) + ' וואטסאפ מוכנים)';
        }
      } catch (e) {}
      if (!done) setTimeout(tick, 2000);
    }
    tick();
  }

  // Render the finished campaign: email summary + a clickable WhatsApp list.
  // campKey (optional): stable key for persisting this result across reloads.
  function renderCampaignResult(c, el, campKey) {

        html += '<div class="wa-item">'
          + '<div><div class="wa-name">' + esc(label) + '</div>'
          + (coup ? '<div class="wa-coupon">' + esc(coup) + '</div>' : '')
          + '</div>'
          + '<a class="wa-send-btn' + sentCls + '" href="' + w.link + '" target="_blank" rel="noopener" data-i="' + i + '" data-phone="' + esc(w.phone || '') + '">' + sentTxt + '</a>'
          + '</div>';
      });
      html += '</div>';

    if (c.revenue_potential) {
      html += '<div class="agent-summary">צפי הכנסה ₪' + c.revenue_potential.toLocaleString()
        + '<br><span style="font-size:12px;color:#666">אעקוב ואדווח כשייסגרו מעגלים. הרווח בפועל יופיע למעלה.</span></div>';
    }
    el.innerHTML = html;

    // Persist the prepared squares so a refresh doesn't lose them.

      fetch('/api/campaign/save-result', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },

          fetch('/api/campaign/mark-sent', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: PASSWORD, key: campKey, phone: btn.dataset.phone })
          }).catch(() => {});
        }
      });
    });
  }
