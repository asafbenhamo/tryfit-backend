<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>היועץ החכם · 770</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b8aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="היועץ 770">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f8fa;
    --sidebar-bg: #f7f8fa;
    --header-bg: rgba(255, 255, 255, 0.9);
    --border: #eceef2;
    --border-strong: #dfe2e8;
    --user-bubble: #0b8aff;
    --user-bubble-2: #0a6fe0;
    --ai-bubble: #f1f3f6;
    --ai-text: #1c1f26;
    --text: #14171c;
    --text-dim: #8a909c;
    --accent: #0b8aff;
    --accent-glow: rgba(11, 138, 255, 0.18);
    --danger: #e0395a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100dvh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--sidebar-bg);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width 0.28s cubic-bezier(0.16,1,0.3,1), transform 0.28s cubic-bezier(0.16,1,0.3,1);
    z-index: 30; overflow: hidden;
  }
  .sidebar.collapsed { width: 0; border-left: none; }
  .sidebar-head, .convo-list { min-width: 280px; }
  .sidebar-head { padding: 14px; border-bottom: 1px solid var(--border); }
  .new-chat-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-family: 'Heebo', sans-serif;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  .new-chat-btn:active { transform: scale(0.97); }
  .new-chat-btn:hover { background: var(--user-bubble-2); }
  .convo-list { flex: 1; overflow-y: auto; padding: 8px; }
  .convo-list::-webkit-scrollbar { width: 6px; }
  .convo-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .convo-item {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    font-size: 14px; color: var(--text); margin-bottom: 2px;
    transition: background 0.15s; position: relative;
  }
  .convo-item:hover { background: rgba(0,0,0,0.05); }
  .convo-item.active { background: rgba(11,138,255,0.12); font-weight: 600; }
  .convo-title {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .convo-del {
    border: none; background: none; color: var(--text-dim); cursor: pointer;
    font-size: 16px; padding: 2px 4px; border-radius: 6px; opacity: 0;
    transition: opacity 0.15s, color 0.15s; flex-shrink: 0;
  }
  .convo-item:hover .convo-del { opacity: 1; }
  .convo-del:hover { color: var(--danger); background: rgba(224,57,90,0.1); }
  .convo-empty { padding: 24px 14px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.6; }

  /* ===== MAIN ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    background: var(--header-bg); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); z-index: 5;
  }
  .menu-btn {
    border: none; background: none; cursor: pointer;
    font-size: 22px; color: var(--text); padding: 2px 6px; flex-shrink: 0;
  }
  .header-text { flex: 1; text-align: center; }
  .header-text h1 { font-size: 16px; font-weight: 700; }
  .header-text p {
    font-size: 12px; color: var(--text-dim); font-weight: 400;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #25c685; box-shadow: 0 0 7px rgba(37,198,133,0.5); animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 0 8px;
    display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth;
    background: var(--bg);
  }
  .messages::-webkit-scrollbar { width: 0; }
  .row { width: 100%; display: flex; padding: 6px 16px; }
  .row.user { justify-content: flex-start; }
  .row.ai   { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 11px 15px;
    font-size: 15.5px; line-height: 1.6; font-weight: 400;
    white-space: pre-wrap; word-wrap: break-word;
    animation: rise 0.32s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes rise { from{opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--user-bubble), var(--user-bubble-2));
    color: #fff; border-radius: 20px 20px 20px 5px;
    box-shadow: 0 2px 10px rgba(11, 138, 255, 0.25);
  }
  .row.ai .bubble {
    background: var(--ai-bubble); color: var(--ai-text);
    border-radius: 20px 20px 5px 20px;
  }
  .row.ai .bubble table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
  .row.ai .bubble th, .row.ai .bubble td { border:1px solid var(--border-strong); padding:6px 9px; text-align:right; }
  .row.ai .bubble th { background: rgba(11,138,255,0.10); font-weight:700; }
  .row.ai .bubble strong { color: #0a6fe0; font-weight: 700; }
  .row.ai .bubble .h { font-size: 16px; font-weight: 700; margin: 10px 0 4px; }
  .row.ai .bubble code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 30px; gap: 14px; animation: rise 0.5s ease;
  }
  .welcome h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .welcome p { font-size: 14.5px; color: var(--text-dim); line-height: 1.6; max-width: 300px; }
  .typing { display: flex; align-items: center; gap: 8px; }
  .typing .dots { display: flex; gap: 4px; }
  .typing .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: bounce 1.3s infinite ease-in-out;
  }
  .typing .dots span:nth-child(2){ animation-delay: 0.18s; }
  .typing .dots span:nth-child(3){ animation-delay: 0.36s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0); opacity:0.5;} 30%{transform:translateY(-6px); opacity:1;} }
  .typing .txt { font-size: 13px; color: var(--text-dim); transition: opacity 0.3s; }
  .composer {
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border);
  }
  .composer-inner {
    display: flex; align-items: flex-end; gap: 8px;
    max-width: 760px; margin: 0 auto;
    background: var(--bg-soft); border: 1px solid var(--border-strong);
    border-radius: 26px; padding: 5px 6px 5px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer-inner:focus-within {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }
  #input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: 'Heebo', sans-serif;
    font-size: 16px; line-height: 1.5; resize: none; max-height: 130px; padding: 9px 0;
  }
  #input::placeholder { color: var(--text-dim); }
  #send {
    width: 38px; height: 38px; flex-shrink: 0; border: none; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 17px; cursor: pointer;
    display: grid; place-items: center;
    transition: transform 0.15s, opacity 0.2s, background 0.2s;
  }
  #send:active { transform: scale(0.88); }
  #send:disabled { opacity: 0.35; cursor: not-allowed; }
  .hint { text-align: center; font-size: 10.5px; color: var(--text-dim); margin-top: 8px; opacity: 0.7; }

  /* overlay for mobile sidebar */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 25;
  }

  /* ===== GATE ===== */
  .gate {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 30px;
  }
  .gate h2 { font-size: 22px; font-weight: 700; }
  .gate p { font-size: 14px; color: var(--text-dim); margin-top: -8px; }
  .gate input {
    width: 100%; max-width: 280px; padding: 14px 18px; border-radius: 14px;
    background: var(--bg-soft); border: 1px solid var(--border-strong);
    color: var(--text); font-size: 16px; outline: none; text-align: center;
    font-family: 'Heebo', sans-serif;
  }
  .gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .gate button {
    width: 100%; max-width: 280px; padding: 14px; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: 'Heebo', sans-serif;
  }
  .gate .err { color: var(--danger); font-size: 13px; min-height: 16px; }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed; top: 0; right: 0; height: 100dvh; width: 280px;
      transform: translateX(100%); box-shadow: -4px 0 24px rgba(0,0,0,0.12);
    }
    .sidebar.collapsed { width: 280px; border-left: 1px solid var(--border); }
    .sidebar.open { transform: translateX(0); }
    .overlay.show { display: block; }
  }
</style>
</head>
<body>
  <div class="gate" id="gate">
    <h2>היועץ החכם של 770</h2>
    <p>העוזר העסקי החכם שלך</p>
    <input type="password" id="gatePass" placeholder="סיסמת גישה" autocomplete="off">
    <button onclick="unlock()">כניסה</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar" style="display:none">
    <div class="sidebar-head">
      <button class="new-chat-btn" onclick="newChat()">+ שיחה חדשה</button>
    </div>
    <div class="convo-list" id="convoList"></div>
  </aside>

  <div class="main" id="main" style="display:none">
    <div class="header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="header-text">
        <h1>היועץ החכם</h1>
        <p><span class="status-dot"></span> מחובר לחנות 770</p>
      </div>
      <div style="width:30px"></div>
    </div>
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h2>איך אפשר לעזור?</h2>
        <p>שאלי אותי כל דבר על החנות — לקוחות, מכירות, מוצרים, או רעיונות לקמפיינים.</p>
      </div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="כתבי הודעה ליועץ..."></textarea>
        <button id="send" onclick="sendMessage()">➤</button>
      </div>
      <div class="hint">היועץ מבוסס על נתונים אמיתיים מהחנות שלך</div>
    </div>
  </div>

<script>
  let PASSWORD = '';
  let history = [];
  let busy = false;
  let currentConvoId = null;
  const $ = id => document.getElementById(id);

  function unlock() {
    const pass = $('gatePass').value.trim();
    if (!pass) { $('gateErr').textContent = 'הזיני סיסמה'; return; }
    PASSWORD = pass;
    $('gate').style.display = 'none';
    $('sidebar').style.display = 'flex';
    $('main').style.display = 'flex';
    $('input').focus();
    loadConvoList();
  }
  $('gatePass').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  /* ===== SIDEBAR ===== */
  function isMobile() { return window.innerWidth <= 768; }
  function toggleSidebar() {
    if (isMobile()) {
      $('sidebar').classList.toggle('open');
      $('overlay').classList.toggle('show');
    } else {
      $('sidebar').classList.toggle('collapsed');
    }
  }
  function closeSidebar() {
    $('sidebar').classList.remove('open');
    $('overlay').classList.remove('show');
  }
  async function loadConvoList() {
    try {
      const res = await fetch('/api/chat/list?password=' + encodeURIComponent(PASSWORD));
      const data = await res.json();
      const list = $('convoList');
      list.innerHTML = '';
      if (!data.conversations || data.conversations.length === 0) {
        list.innerHTML = '<div class="convo-empty">אין עדיין שיחות שמורות.<br>התחילי לכתוב והשיחה תישמר כאן.</div>';
        return;
      }
      data.conversations.forEach(c => {
        const item = document.createElement('div');
        item.className = 'convo-item' + (c.id === currentConvoId ? ' active' : '');
        item.onclick = (e) => { if (!e.target.classList.contains('convo-del')) loadConvo(c.id); };
        const title = document.createElement('div');
        title.className = 'convo-title';
        title.textContent = c.title || 'שיחה';
        const del = document.createElement('button');
        del.className = 'convo-del';
        del.textContent = '🗑';
        del.onclick = (e) => { e.stopPropagation(); deleteConvo(c.id); };
        item.appendChild(title);
        item.appendChild(del);
        list.appendChild(item);
      });
    } catch (err) {
      console.error('loadConvoList error', err);
    }
  }
  async function loadConvo(id) {
    try {
      const res = await fetch('/api/chat/get/' + id + '?password=' + encodeURIComponent(PASSWORD));
      const data = await res.json();
      if (!data.ok) return;
      currentConvoId = data.conversation.id;
      history = Array.isArray(data.conversation.messages) ? data.conversation.messages : [];
      renderHistory();
      loadConvoList();
      closeSidebar();
    } catch (err) {
      console.error('loadConvo error', err);
    }
  }
  async function deleteConvo(id) {
    if (!confirm('למחוק את השיחה?')) return;
    try {
      await fetch('/api/chat/delete/' + id + '?password=' + encodeURIComponent(PASSWORD), { method: 'DELETE' });
      if (id === currentConvoId) newChat();
      loadConvoList();
    } catch (err) {
      console.error('deleteConvo error', err);
    }
  }
  function newChat() {
    currentConvoId = null;
    history = [];
    $('messages').innerHTML = '<div class="welcome" id="welcome"><h2>איך אפשר לעזור?</h2><p>שאלי אותי כל דבר על החנות — לקוחות, מכירות, מוצרים, או רעיונות לקמפיינים.</p></div>';
    loadConvoList();
    closeSidebar();
    $('input').focus();
  }

  /* ===== RENDER ===== */
  function renderHistory() {
    const m = $('messages');
    m.innerHTML = '';
    history.forEach(msg => {
      const role = msg.role === 'user' ? 'user' : 'ai';
      addMessageDom(role, msg.content);
    });
    scrollDown();
  }
  function render(text) {
    let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const lines = html.split('\n');
    let out = [], inTable = false;
    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];
      const isRow = /^\s*\|.*\|\s*$/.test(line);
      const isSep = /^\s*\|[\s:|-]+\|\s*$/.test(line);
      if (isRow && isSep) continue;
      if (isRow) {
        const cells = line.split('|').slice(1,-1).map(c=>c.trim());
        const isHeader = !inTable;
        if (!inTable) { out.push('<table>'); inTable = true; }
        const tag = isHeader ? 'th' : 'td';
        out.push('<tr>' + cells.map(c=>'<'+tag+'>'+c+'</'+tag+'>').join('') + '</tr>');
      } else {
        if (inTable) { out.push('</table>'); inTable = false; }
        const h = line.match(/^\s*#{1,4}\s*(.+)$/);
        if (h) { out.push('<div class="h">' + h[1] + '</div>'); }
        else { out.push(line); }
      }
    }
    if (inTable) out.push('</table>');
    return out.join('\n');
  }
  function addMessageDom(role, text) {
    const w = $('welcome'); if (w) w.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'ai') bubble.innerHTML = render(text);
    else bubble.textContent = text;
    row.appendChild(bubble);
    $('messages').appendChild(row);
    return bubble;
  }
  function addMessage(role, text) {
    const b = addMessageDom(role, text);
    scrollDown();
    return b;
  }

  /* ===== TYPING ===== */
  let typingTimer = null;
  const THINKING_STAGES = [
    'קורא את השאלה...',
    'שולף נתונים מהחנות...',
    'מנתח לקוחות והזמנות...',
    'בודק מה במלאי...',
    'מחבר את התובנות...',
    'מנסח לך תשובה...'
  ];
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row ai';
    row.id = 'typing-msg';
    row.innerHTML = '<div class="bubble"><div class="typing"><div class="dots"><span></span><span></span><span></span></div><div class="txt" id="typing-txt">' + THINKING_STAGES[0] + '</div></div></div>';
    $('messages').appendChild(row);
    scrollDown();
    let stage = 0;
    const advance = () => {
      stage++;
      const txt = $('typing-txt');
      if (!txt) return;
      if (stage < THINKING_STAGES.length) {
        txt.textContent = THINKING_STAGES[stage];
        const delay = stage < 3 ? 1100 : 2200;
        typingTimer = setTimeout(advance, delay);
      }
    };
    typingTimer = setTimeout(advance, 1100);
  }
  function removeTyping() {
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    const t = $('typing-msg'); if (t) t.remove();
  }
  function scrollDown() {
    const m = $('messages');
    requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
  }

  /* ===== INPUT ===== */
  const input = $('input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 130) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ===== SAVE ===== */
  async function saveConvo() {
    try {
      const title = (history[0] && history[0].content ? history[0].content : 'שיחה חדשה').substring(0, 60);
      const res = await fetch('/api/chat/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentConvoId, title: title, messages: history, password: PASSWORD })
      });
      const data = await res.json();
      if (data.ok && data.id) {
        const wasNew = !currentConvoId;
        currentConvoId = data.id;
        if (wasNew) loadConvoList();
      }
    } catch (err) {
      console.error('saveConvo error', err);
    }
  }

  /* ===== SEND ===== */
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; $('send').disabled = true;
    addMessage('user', text);
    input.value = ''; input.style.height = 'auto';
    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history, password: PASSWORD })
      });
      const data = await res.json();
      removeTyping();
      if (data.error) { addMessage('ai', '⚠️ ' + data.error); }
      else {
        addMessage('ai', data.answer);
        history = data.history || history;
        saveConvo();
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', '⚠️ שגיאת תקשורת. נסי שוב בעוד רגע.');
    } finally {
      busy = false; $('send').disabled = false; input.focus();
    }
  }
</script>
</body>
</html>
