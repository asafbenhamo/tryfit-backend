        const items = (f.items || '').split(',').filter(Boolean).map(pair => {
          const [vid, qty] = pair.split(':');
          return { variant_id: parseInt(vid.trim()), quantity: parseInt(qty || '1') };
        });
        const res = await fetch('/api/action/build-cart', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: PASSWORD, email: f.email || null, phone: f.phone || null,
            customer_name: f.name || null, items,
            discount_percentage: f.discount ? parseInt(f.discount) : null,
            message_subject: f.subject || 'הכנו לך משהו מיוחד', message_body: f.body || ''
          })
        });
        const data = await res.json();
        card.querySelector('.action-btns').style.display = 'none';
        resultDiv.style.display = 'block';
        if (data.ok) {
          let msg = '✅ העגלה נבנתה! ';
          if (data.steps.cart) msg += 'סכום: ₪' + data.steps.cart.total + '. ';
          if (data.steps.message && data.steps.message.channel === 'whatsapp') {
            msg += '<br><a href="' + data.steps.message.ready_link + '" target="_blank" class="wa-link">📱 שלח ב-WhatsApp</a>';
          } else if (data.steps.message && data.steps.message.ok) {
            msg += 'הלינק נשלח במייל.';
          }
          resultDiv.innerHTML = msg; resultDiv.className = 'action-result success';
          loadMoneyCounter();
        } else if (data.blocked) {
          resultDiv.innerHTML = '🚫 ' + (data.detail || 'נחסם'); resultDiv.className = 'action-result blocked';
        } else {
          resultDiv.innerHTML = '❌ ' + (data.error || 'שגיאה'); resultDiv.className = 'action-result error';
        }
      } catch (err) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '❌ שגיאה: ' + err.message; resultDiv.className = 'action-result error';
      }
    };
  }
  // Batch card: build many personalized carts at once, then show one WhatsApp
  // square per customer (same UX as a campaign).
  function renderCartBatchCard(batch, container) {
    const carts = batch.carts;
    const card = document.createElement('div');
    card.className = 'action-card campaign-card';
    let html = '<div class="action-head">🛍️ ' + carts.length + ' עגלות מותאמות מוכנות להפעלה</div>';
    html += '<div class="action-row"><span>לקוחות:</span> ' + carts.length + '</div>';
    html += '<div class="action-row"><span>הנחה אישית לכל אחת:</span> ' + esc(carts[0].discount || '15') + '%</div>';
    const autoAvailableCart = window._waConfigured && window._waTemplates && window._waTemplates.length > 0;
    const cartModeId = 'cm_' + Math.random().toString(36).slice(2, 8);
    if (autoAvailableCart) {
      html += '<div class="send-mode" style="display:flex;gap:8px;margin:6px 0 8px">'
        + '<label style="flex:1;border:1px solid #dbe6fb;border-radius:8px;padding:8px;cursor:pointer;font-size:13px;text-align:center"><input type="radio" name="' + cartModeId + '" value="manual" checked> ידני (אני שולח)</label>'
        + '<label style="flex:1;border:1px solid #dbe6fb;border-radius:8px;padding:8px;cursor:pointer;font-size:13px;text-align:center"><input type="radio" name="' + cartModeId + '" value="auto"> אוטומטי 💬</label>'
        + '</div>';
    }
    html += '<div class="action-btns"><button class="action-approve">בנה את כל העגלות ←</button><button class="action-cancel">בטל</button></div>';
    html += '<div class="action-result" style="display:none"></div>';
    card.innerHTML = html;
    container.appendChild(card);

    const approveBtn = card.querySelector('.action-approve');
    const cancelBtn = card.querySelector('.action-cancel');
    const resultDiv = card.querySelector('.action-result');
    cancelBtn.onclick = () => card.remove();
    function cartSendMode() {
      const sel = card.querySelector('input[name="' + cartModeId + '"]:checked');
      return sel ? sel.value : 'manual';
    }
    approveBtn.onclick = () => {
      if (cartSendMode() === 'auto') {
        // Map carts to a segment and reuse the automatic template sender.
        const segment = carts.map(c => ({ name: c.name || '', phone: c.phone || null, email: c.email || null,
          est_value: 0 }));
        const fakeFields = { type: 'personalized_cart', percentage: carts[0].discount || 15 };
        startAutoCampaign(card, fakeFields, segment, carts.length, approveBtn, cancelBtn, resultDiv);
        return;
      }
      confirmSendGate(carts.length, 'whatsapp', async () => {
      approveBtn.disabled = true; cancelBtn.disabled = true; approveBtn.textContent = 'בונה את כל העגלות...';
      try {
        const payload = carts.map(f => ({
          name: f.name || null, email: f.email || null, phone: f.phone || null,
          discount: f.discount ? parseInt(f.discount) : null,
          subject: f.subject || 'הכנו לך עגלה אישית 🛍️',
          body: f.body || '',
          items: (f.items || '').split(',').filter(Boolean).map(pair => {
            const [vid, qty] = pair.split(':');
            return { variant_id: parseInt(vid.trim()), quantity: parseInt(qty || '1') };
          })
        }));
        const res = await fetch('/api/cart/build-batch', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: PASSWORD, carts: payload })
        });
        const data = await res.json();
        card.querySelector('.action-btns').style.display = 'none';
        resultDiv.style.display = 'block';
        if (!data.ok) { resultDiv.className = 'action-result error'; resultDiv.innerHTML = '❌ ' + (data.error || 'שגיאה'); return; }
        resultDiv.className = 'action-result success';
        const wa = data.whatsapp || [];
        let h = '<div class="camp-status">✅ ' + (data.total) + ' עגלות נבנו!';
        if (data.emails_sent > 0) h += ' ' + data.emails_sent + ' מיילים נשלחו אוטומטית.';
        if (data.failed > 0) h += ' (' + data.failed + ' נכשלו)';
        h += '</div>';
        if (wa.length > 0) {
          h += '<div class="wa-progress">📱 ' + wa.length + ' הודעות וואטסאפ מוכנות. לחץ "שלח" ליד כל לקוחה. <strong id="cartWaSent">0</strong>/' + wa.length + ' נשלחו</div>';
          h += '<div class="wa-list">';
          wa.forEach((w, i) => {
            const label = w.name || w.phone || 'לקוחה';
            const coup = w.coupon ? ('קוד: ' + w.coupon) : '';
            h += '<div class="wa-item"><div><div class="wa-name">' + esc(label) + '</div>'
              + (coup ? '<div class="wa-coupon">' + esc(coup) + '</div>' : '') + '</div>'
              + '<a class="wa-send-btn" href="' + w.link + '" target="_blank" rel="noopener" data-i="' + i + '">שלח ←</a></div>';
          });
          h += '</div>';
        }
        resultDiv.innerHTML = h;
        let sentCount = 0;
        resultDiv.querySelectorAll('.wa-send-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (btn.classList.contains('sent')) return;
            btn.classList.add('sent'); btn.textContent = '✓ נשלח';
            sentCount++;
            const counter = resultDiv.querySelector('#cartWaSent');
            if (counter) counter.textContent = sentCount;
          });
        });
        loadMoneyCounter();
      } catch (err) {
        resultDiv.style.display = 'block';
        resultDiv.className = 'action-result error';
        resultDiv.innerHTML = '❌ שגיאה: ' + err.message;
      }
      });
    };
  }
  function renderActionCard(action, container) {
    const f = action.fields;
    const card = document.createElement('div');
    card.className = 'action-card';
    const channel = (f.phone && f.phone.length >= 8) ? 'WhatsApp' : 'מייל';
    let html = '<div class="action-head">⚡ פעולה מוכנה לאישור</div>';
    html += '<div class="action-row"><span>נמען:</span> ' + esc(f.name || f.email || f.phone || '—') + '</div>';
    html += '<div class="action-row"><span>ערוץ:</span> ' + channel + (f.phone ? ' (' + esc(f.phone) + ')' : (f.email ? ' (' + esc(f.email) + ')' : '')) + '</div>';
    if (f.coupon) html += '<div class="action-row"><span>קופון:</span> ' + esc(f.coupon) + '% הנחה' + (f.coupon_days ? ', ' + esc(f.coupon_days) + ' ימים' : '') + '</div>';
    if (f.subject) html += '<div class="action-row"><span>נושא:</span> ' + esc(f.subject) + '</div>';
    if (f.body) html += '<div class="action-body">' + esc(f.body).replace(/\{COUPON\}/g,'[הקוד האישי שלך]').replace(/\n/g,'<br>') + '</div>';
    const isWa = (f.phone && f.phone.length >= 8);
    const autoAvailAction = isWa && window._waConfigured && window._waTemplates && window._waTemplates.length > 0;
    const actModeId = 'am_' + Math.random().toString(36).slice(2, 8);
    if (autoAvailAction) {
      html += '<div class="send-mode" style="display:flex;gap:8px;margin:6px 0 8px">'
        + '<label style="flex:1;border:1px solid #dbe6fb;border-radius:8px;padding:8px;cursor:pointer;font-size:13px;text-align:center"><input type="radio" name="' + actModeId + '" value="manual" checked> ידני (אני שולח)</label>'
        + '<label style="flex:1;border:1px solid #dbe6fb;border-radius:8px;padding:8px;cursor:pointer;font-size:13px;text-align:center"><input type="radio" name="' + actModeId + '" value="auto"> אוטומטי 💬</label>'
        + '</div>';
    }
    html += '<div class="action-btns"><button class="action-approve">אשר ושלח ←</button><button class="action-cancel">בטל</button></div>';
    html += '<div class="action-result" style="display:none"></div>';
    card.innerHTML = html;
    container.appendChild(card);

    const approveBtn = card.querySelector('.action-approve');
    const cancelBtn = card.querySelector('.action-cancel');
    const resultDiv = card.querySelector('.action-result');

    cancelBtn.onclick = () => { card.remove(); };
    function actSendMode() {
      const sel = card.querySelector('input[name="' + actModeId + '"]:checked');
      return sel ? sel.value : 'manual';
    }
    approveBtn.onclick = async () => {
      if (actSendMode() === 'auto') {
        const segment = [{ name: f.name || '', phone: f.phone || null, email: f.email || null, est_value: 0 }];
        startAutoCampaign(card, { type: f.type || 'win_back', percentage: f.coupon ? parseInt(f.coupon) : null,
          amount_ils: f.coupon_ils ? parseFloat(f.coupon_ils) : null }, segment, 1, approveBtn, cancelBtn, resultDiv);
        return;
      }
      approveBtn.disabled = true; cancelBtn.disabled = true;
      approveBtn.textContent = 'שולח...';
      try {
        const res = await fetch('/api/action/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: PASSWORD,
            action_type: f.type || 'campaign',
            email: f.email || null,
            phone: f.phone || null,
            customer_name: f.name || null,
            create_coupon: !!(f.coupon || f.coupon_ils),
            coupon_percentage: f.coupon ? parseInt(f.coupon) : null,
            coupon_ils: f.coupon_ils ? parseFloat(f.coupon_ils) : null,
            coupon_code: f.coupon_code || null,
            coupon_days: f.coupon_days ? parseInt(f.coupon_days) : 2,
            coupon_combine: (f.combine === 'no' || f.combine === 'false') ? false : true,
            message_subject: f.subject || 'הודעה מ-770',
            message_body: f.body || ''
          })
        });
        const data = await res.json();
        card.querySelector('.action-btns').style.display = 'none';
        resultDiv.style.display = 'block';
        if (data.ok) {
          let msg = '✅ בוצע! ';
          if (data.steps && data.steps.coupon && data.steps.coupon.ok) msg += 'קופון ' + data.steps.coupon.code + ' נוצר. ';
          if (data.steps && data.steps.message) {
            if (data.steps.message.channel === 'email' && data.steps.message.ok) msg += 'המייל נשלח.';
            else if (data.steps.message.channel === 'whatsapp') {
              msg += '<br><a href="' + data.steps.message.ready_link + '" target="_blank" class="wa-link">📱 לחץ לשליחה ב-WhatsApp</a>';
            }
          }
          resultDiv.innerHTML = msg;
          resultDiv.className = 'action-result success';
          loadMoneyCounter();
        } else if (data.blocked) {
          resultDiv.innerHTML = '🚫 ' + (data.detail || 'הפעולה נחסמה');
          resultDiv.className = 'action-result blocked';
        } else {
          resultDiv.innerHTML = '❌ ' + (data.error || 'שגיאה');
          resultDiv.className = 'action-result error';
        }
      } catch (err) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '❌ שגיאה: ' + err.message;
        resultDiv.className = 'action-result error';
      }
    };
  }

  function addMessageDom(role, text) {
    clearHomeScreen();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'ai') {
      const action = parseAction(text);
      const allCarts = parseAllCarts(text);
      const isBatchCart = allCarts && allCarts.carts.length > 1;
      const cart = isBatchCart ? null : parseCart(text);
      const campaign = parseCampaign(text);
      const displayText = campaign ? campaign.cleanText : (isBatchCart ? allCarts.cleanText : (cart ? cart.cleanText : (action ? action.cleanText : text)));
      bubble.innerHTML = render(displayText);
      row.appendChild(bubble);
      $('messages').appendChild(row);
      if (campaign) {
        const cardRow = document.createElement('div');
        cardRow.className = 'action-row-wrap';
        renderCampaignCard(campaign, cardRow);
        $('messages').appendChild(cardRow);
      } else if (isBatchCart) {
        const cardRow = document.createElement('div');
        cardRow.className = 'action-row-wrap';
        renderCartBatchCard(allCarts, cardRow);
        $('messages').appendChild(cardRow);
      } else if (cart) {
        const cardRow = document.createElement('div');
        cardRow.className = 'action-row-wrap';
        renderCartCard(cart, cardRow);
        $('messages').appendChild(cardRow);
      } else if (action) {
        const cardRow = document.createElement('div');
        cardRow.className = 'action-row-wrap';
        renderActionCard(action, cardRow);
        $('messages').appendChild(cardRow);
      }
      return bubble;
    } else {
      bubble.textContent = text;
      row.appendChild(bubble);
    }
    $('messages').appendChild(row);
    return bubble;
  }
  function addMessage(role, text) {
    const b = addMessageDom(role, text);
    trimVisibleMessages();
    scrollDown();
    return b;
  }

  /* ===== TYPING ===== */
  let typingTimer = null;
  const THINKING_STAGES = [
    'קורא את השאלה...',
    'שולף נתונים מהחנות...',
    'מנתח לקוחות והזמנות...',
    'בודק מה במלאי...',
    'מחבר את התובנות...',
    'מנסח לך תשובה...'
  ];
  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row ai';
    row.id = 'typing-msg';
    row.innerHTML = '<div class="bubble"><div class="typing"><div class="dots"><span></span><span></span><span></span></div><div class="txt" id="typing-txt">' + THINKING_STAGES[0] + '</div></div></div>';
    $('messages').appendChild(row);
    scrollDown();
    let stage = 0;
    const advance = () => {
      stage++;
      const txt = $('typing-txt');
      if (!txt) return;
      if (stage < THINKING_STAGES.length) {
        txt.textContent = THINKING_STAGES[stage];
        const delay = stage < 3 ? 1100 : 2200;
        typingTimer = setTimeout(advance, delay);
      }
    };
    typingTimer = setTimeout(advance, 1100);
  }
  function removeTyping() {
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    const t = $('typing-msg'); if (t) t.remove();
  }
  function scrollDown() {
    const m = $('messages');
    requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
  }

  /* ===== INPUT ===== */
  const input = $('input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 130) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ===== SAVE ===== */
  async function saveConvo() {
    try {
      const title = (history[0] && history[0].content ? history[0].content : 'שיחה חדשה').substring(0, 60);
      const res = await fetch('/api/chat/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentConvoId, title: title, messages: history, password: PASSWORD })
      });
      const data = await res.json();
      if (data.ok && data.id) {
        const wasNew = !currentConvoId;
        currentConvoId = data.id;
        if (wasNew) loadConvoList();
      }
    } catch (err) {
      console.error('saveConvo error', err);
    }
  }

  /* ===== SEND ===== */
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; $('send').disabled = true;
    addMessage('user', text);
    input.value = ''; input.style.height = 'auto';
    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history, password: PASSWORD })
      });
      const data = await res.json();
      removeTyping();
      if (data.error) { addMessage('ai', '⚠️ ' + data.error); }
      else {
        await streamAnswer(data.answer);
        history = data.history || history;
        saveConvo();
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', '⚠️ שגיאת תקשורת. נסי שוב בעוד רגע.');
    } finally {
      busy = false; $('send').disabled = false; input.focus();
    }
  }

  function streamAnswer(fullText) {
    return new Promise(resolve => {
      const action = parseAction(fullText);
      const allCarts = parseAllCarts(fullText);
      const isBatchCart = allCarts && allCarts.carts.length > 1;
      const cart = isBatchCart ? null : parseCart(fullText);
      const campaign = parseCampaign(fullText);
      const displayText = campaign ? campaign.cleanText : (isBatchCart ? allCarts.cleanText : (cart ? cart.cleanText : (action ? action.cleanText : fullText)));

      clearHomeScreen();
      const row = document.createElement('div');
      row.className = 'row ai';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      row.appendChild(bubble);
      $('messages').appendChild(row);

      const tokens = displayText.split(/(\s+)/);
      let i = 0;
      const chunk = 2;
      function step() {
        if (i >= tokens.length) {
          bubble.innerHTML = render(displayText);
          if (campaign) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderCampaignCard(campaign, cardRow);
            $('messages').appendChild(cardRow);
          } else if (isBatchCart) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderCartBatchCard(allCarts, cardRow);
            $('messages').appendChild(cardRow);
          } else if (cart) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderCartCard(cart, cardRow);
            $('messages').appendChild(cardRow);
          } else if (action) {
            const cardRow = document.createElement('div');
            cardRow.className = 'action-row-wrap';
            renderActionCard(action, cardRow);
            $('messages').appendChild(cardRow);
          }
          scrollDown();
          resolve();
          return;
        }
        i += chunk;
        const partial = tokens.slice(0, i).join('');
        bubble.innerHTML = render(partial);
        scrollDown();
        setTimeout(step, 28);
      }
      step();
    });
  }
</script>
