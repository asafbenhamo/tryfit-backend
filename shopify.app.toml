# ============================================================================
# Shopify app configuration.
#
# This file is what lets `shopify app deploy` publish the app's configuration
# and its theme extension. Without it, the popup extension in extensions/ is
# just files in a repo — it can never reach a merchant's theme editor, because
# there is nothing telling Shopify the extension exists.
#
# It also declares the three mandatory compliance webhooks, which means
# deploying sets them instead of someone remembering to paste the same URL into
# three boxes in the Partner Dashboard. If those are wrong or missing, app
# review fails automatically, so having them in version control next to the
# handler that serves them is worth more than the convenience.
#
# BEFORE THE FIRST DEPLOY: client_id below is a placeholder. Either paste the
# app's Client ID from the Partner Dashboard (Apps -> your app -> Overview), or
# run `shopify app config link` and let the CLI fill it in.
# ============================================================================

name = "Smart Advisor"
handle = "smart-advisor"

# Replace with the real Client ID, or run: shopify app config link
client_id = "REPLACE_WITH_CLIENT_ID"

application_url = "https://tryfit-backend-production.up.railway.app"

# The app renders inside the Shopify admin (App Bridge + session tokens).
embedded = true

[access_scopes]
scopes = "read_customers,write_customers,read_orders,read_products,read_inventory,read_checkouts,read_fulfillments,read_locations,read_price_rules,read_discounts,read_marketing_events,write_discounts,write_draft_orders"

[auth]
redirect_urls = [
  "https://tryfit-backend-production.up.railway.app/auth/callback"
]

[webhooks]
api_version = "2026-01"

  # The three Shopify requires of every app. All three are handled at the same
  # endpoint, which verifies the HMAC over the raw body and fails closed.
  [webhooks.privacy_compliance]
  customer_deletion_url = "https://tryfit-backend-production.up.railway.app/webhooks/compliance"
  customer_data_request_url = "https://tryfit-backend-production.up.railway.app/webhooks/compliance"
  shop_deletion_url = "https://tryfit-backend-production.up.railway.app/webhooks/compliance"

  # Declared here as well as registered per-install, so a shop whose
  # registration call failed at install time still reaches us.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/orders/create"

  # Two topics, two routes. The server mounts a separate path for each even
  # though one function handles both, so they are declared separately rather
  # than pointed at one URL that only happens to work.
  [[webhooks.subscriptions]]
  topics = [ "checkouts/create" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/checkouts/create"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/update" ]
  uri = "https://tryfit-backend-production.up.railway.app/webhooks/checkouts/update"

[pos]
embedded = false

[build]
include_config_on_deploy = true
